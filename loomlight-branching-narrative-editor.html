/* ---- Twee (Twine 2 / Tweego-compatible) export & import ---- */
/* library fields that ride along in StoryData — Loomlight-specific keys are
   ignored by other Twee tools, and Loomlight reads them back on import */
var TWEE_LIB_FIELDS = {
  character: ['name','color','location','temperature','role','portrait','description','goals','flaw','encounter','category','abilities','traits','attributes'],
  location:  ['name','color','description','links'],
  item:      ['name','present'],
  variable:  ['name','value','label','group'],
  world:     ['name','pairs'],
  voice:     ['name','color','description']
};
/* one library entry → a compact object with only its filled-in fields */
function tweeLibOut(e, fields){
  var o = {};
  fields.forEach(function(k){
    var v = e[k];
    if (v === undefined || v === null || v === '') return;
    if (typeof v === 'object' && !Object.keys(v).length) return;   /* empty grid, trait or ability list */
    o[k] = v;
  });
  return o;
}
/* the whole worldbuilding library, keyed for StoryData */
function tweeLibraryData(){
  var out = {};
  Object.keys(TWEE_LIB_FIELDS).forEach(function(kind){
    var list = libArr(kind).filter(function(e){ return e && e.name; })
                           .map(function(e){ return tweeLibOut(e, TWEE_LIB_FIELDS[kind]); });
    if (list.length) out[kind === 'world' ? 'worldbuilding' : kind + 's'] = list;
  });
  return out;
}
function tweeExport(){
  var sNode = byId(story.meta.start);
  var data = { start: sNode ? sNode.title : '' };
  /* Twee 3: StoryData carries the IFID — mint one on first export and keep it stable */
  if (!story.meta.ifid){ story.meta.ifid = makeIFID(); save(); }
  data.ifid = String(story.meta.ifid).toUpperCase();
  /* a passage reference may use the tag only when exactly one scene carries it —
     shared tags ("bargain" on two scenes) would rewire the graph on import, so
     those references fall back to the title */
  var tagUses = {};
  story.nodes.forEach(function(n){
    var tg = String(n && n.tag || '').trim().toLowerCase();
    if (tg) tagUses[tg] = (tagUses[tg] || 0) + 1;
  });
  function passageRef(n){
    if (!n) return '';
    var tg = String(n.tag || '').trim();
    return (tg && tagUses[tg.toLowerCase()] === 1) ? tg : n.title;
  }

var BEAT_COLORS = {
  'opening': '#7c9ecf', 'inciting incident': '#e8b34b', 'rising action': '#e79a4b',
  'midpoint': '#c98ad4', 'crisis': '#d4636f', 'climax': '#d43b3b',
  'falling action': '#7fbf7f', 'resolution': '#5fae7f', 'denouement': '#8fa8b8',
  'backstory': '#9aa8d8'
};
function beatColor(b){
  var k = String(b || '').trim().toLowerCase();
  if (!k) return '#5a6474';
  if (BEAT_COLORS[k]) return BEAT_COLORS[k];
  var h = 0;
  for (var i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) % 360;
  return 'hsl(' + h + ', 52%, 56%)';
}

/* ---------------- script view: linear read of the whole story ---------------- */
function scriptExitsOf(n){
  /* explicit choices first, then plain links — deduped by target, like the canvas */
  var seen = {}, lines = [];
  (Array.isArray(n.choices) ? n.choices : []).forEach(function(c){
    if (!c) return;
    var t = c.target ? resolveNodeRef(c.target) : null;
    var label = String(c.label || '').trim() || (t ? t.title : '');
    if (!label && !t) return;
    var key = t ? t.id : label;
    if (seen[key]) return;
    seen[key] = true;
    lines.push({ label: label, to: t ? t.title : null, cond: c.cond || '' });
  });
  story.links.forEach(function(l){
    if (l.from !== n.id) return;
    var t = byId(l.to);
    if (!t || seen[t.id]) return;
    seen[t.id] = true;
    lines.push({ label: String(l.label || '').trim() || t.title, to: t.title, cond: l.cond || '' });
  });
  return lines;
}
/* ---------------- reading order ----------------
   The story as the reader will meet it: a breadth-first walk from the
   start scene through every structural exit — explicit choices, drawn
   connections, inline [[links]] (Player nodes never offer theirs), jump
   targets and a Condition node's then/else. Notes stay out (authoring
   only); scenes no exit leads into fall to `unreached`. Page numbers are
   the order of first encounter — the gamebook spine of the map. */
function readerExitsOf(n){
  var seen = {}, exits = [];
  function take(ref, label, cond, main){
    var t = ref ? resolveNodeRef(ref) : null;
    var key = t ? t.id : String(ref || '');
    if (!key || seen[key]) return;
    seen[key] = true;
    exits.push({ node: t, label: String(label || '').trim(), cond: cond || '', main: !!main });
  }
  (Array.isArray(n.choices) ? n.choices : []).forEach(function(c){ if (c) take(c.target, c && c.label, c && c.cond); });
  story.links.forEach(function(l){
    if (l.from === n.id) take(l.to, l.label, l.cond, !!l.main);
  });
  if (n.type !== 'player') textLinks(n.text).forEach(function(t){ take(t.target, t.label, t.cond); });
  if (n.type === 'jump' && n.jumpTo) take(n.jumpTo);
  if (n.type === 'condition'){ take(n.then, 'If true'); take(n.else, 'Otherwise'); }
  return exits;
}
function playOrderPages(){
  var seenPages = {}, queue = [], pages = [];
  var startNode = byId(story.meta.start);
  if (startNode){ seenPages[startNode.id] = true; queue.push(startNode); }
  while (queue.length){
    var n = queue.shift();
    pages.push(n);
    readerExitsOf(n).forEach(function(x){
      if (x.node && !seenPages[x.node.id]){ seenPages[x.node.id] = true; queue.push(x.node); }
    });
  }
  var unreached = story.nodes.filter(function(n){ return n.type !== 'note' && !seenPages[n.id]; });
  return { pages: pages, unreached: unreached };
}
/* restamp the timeline order (tord) with the reading order — Timeline rows
   and the Script view line up with how the story actually plays; unreached
   scenes keep their relative order, trailing after the played pages */
function reSortTimelineByReadingOrder(){
  var walk = playOrderPages();
  pushUndo();
  walk.pages.forEach(function(n, i){ n.tord = i; });
  var tail = walk.pages.length;
  walk.unreached.slice().sort(function(a, b){ return (a.tord || 0) - (b.tord || 0); }).forEach(function(n){ n.tord = tail++; });
  save();
  toast('⇅ Timeline re-sorted by reading order.');
  renderActiveView();
}
/* 📖 Reading-order view: the gamebook walk from playOrderPages(), one card per page —
   each exit cross-references the page number it leads to, unreached scenes trail at the bottom */
function renderPlayOrder(){
  var box = $('playview');
  if (!box) return;
  var walk = playOrderPages();
  var pageNum = {};
  walk.pages.forEach(function(n, i){ pageNum[n.id] = i + 1; });
  var html = '<div class="sheetbar"><h2>📖 Reading order</h2><span class="hint">' +
    'The story as the reader will meet it — a walk from the start scene through every exit, numbered like a gamebook. Click a page to open it on the map.</span></div>';
  if (!walk.pages.length){
    box.innerHTML = html + '<div class="pempty">No start scene yet — set one from a scene&#39;s inspector, or wire your scenes together first.</div>';
    return;
  }
  html += '<div class="po-stats"><b>' + walk.pages.length + '</b> play page' + (walk.pages.length === 1 ? '' : 's') +
    (walk.unreached.length ? ' · <b>' + walk.unreached.length + '</b> <span title="Scenes no exit leads into — the reader never reaches them">unreached</span>' : '') + '</div>' +
    '<div class="po-tools"><button class="tbtn" data-po="run">▶ Run from the start</button>' +
    '<button class="tbtn" data-po="resort" title="Restamp the timeline order with this reading order — Timeline and Script views follow it">⇅ Re-sort timeline by reading order</button></div>' +
    '<div class="po">';
  walk.pages.forEach(function(n, i){
    var arc = n.arc ? arcById(n.arc) : null;
    html += '<div class="po-page" data-id="' + esc(n.id) + '" title="Click to open this scene on the map">' +

        '<span class="po-num">' + (i + 1) + '</span>' +

        (n.id === story.meta.start ? '<span class="script-start">▶ START</span>' : '') +
      '</div>';
    var exits = readerExitsOf(n);
    if (exits.length){
      html += '<div class="po-next">' + exits.map(function(x){
          if (!x.node) return '<span class="po-exit">▸ ' + esc(x.label || '?') + ' <i class="po-dangling">→ unresolvable</i></span>';

            ' <i>→ p.' + (pageNum[x.node.id] || '?') + '</i>' +
            (x.cond ? ' <i class="po-cond">if ' + esc(x.cond) + '</i>' : '') +
            (x.node.req ? ' <i class="po-cond">⚔ arrival needs: ' + esc(x.node.req) + '</i>' : '') + '</span>';
        }).join('') + '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  if (walk.unreached.length){
    html += '<div class="po-unreached"><div>✎ Unreached scenes — no exit leads here, the reader never meets them:</div>' +
      walk.unreached.map(function(n){
        return '<span class="po-chip" data-id="' + esc(n.id) + '">' + (TYPE_ICON[n.type] || '') + ' ' + esc(n.title) + '</span>';
      }).join('') + '</div>';
  }
  box.innerHTML = html;
  Array.prototype.forEach.call(box.querySelectorAll('.po-page, .po-chip'), function(row){
    row.onclick = function(){
      var id = row.getAttribute('data-id');
      if (!id) return;
      setMode('map');
      selectNode(id);
      focusNode(id);
    };
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-po]'), function(btn){
    btn.onclick = function(){
      if (btn.getAttribute('data-po') === 'run') openPlayer(story.meta.start);
      else reSortTimelineByReadingOrder();
    };
  });
}
/* 📜 Script view: a linear, read-only pass over orderedScenes() — prose preview, speaker
   cue, jump/condition line, exit list; clicking a card opens that scene on the map */
function renderScript(){
  var box = $('scriptview');
  if (!box) return;
  var scenes = orderedScenes().filter(function(n){ return n.type !== 'note'; });
  var html = '<div class="sheetbar"><h2>📜 Script</h2><span class="hint">' +
    'A linear read of the whole story in timeline order — body, spoken lines, choices and jumps. Read-only; click any heading to jump to that scene on the map.</span></div>';
  if (!scenes.length){
    html += '<div class="pempty">Nothing here yet — add a scene first.</div>';
  } else {
    html += '<div class="script">';
    scenes.forEach(function(n){
      var cue = null;
      if (n.type === 'npc' && n.speaker) cue = (characterById(n.speaker) || {}).name || null;
      else if (n.type === 'exposition' && n.voice) cue = (voiceById(n.voice) || {}).name || null;
      else if (n.character) cue = n.character;
      var jumpTo = n.type === 'jump' ? (resolveNodeRef(n.jumpTo) || null) : null;
      var jumpTag = (n.type === 'jump' && !jumpTo && n.jumpTo) ? (/^[a-z0-9][a-z0-9-]*$/i.test(n.jumpTo) ? '#' + n.jumpTo : '\u201c' + n.jumpTo + '\u201d') : '';
      var exits = scriptExitsOf(n);
      html += '<div class="script-scene" data-id="' + esc(n.id) + '" title="Click to open this scene on the map">' +
        '<div class="script-h">' +
          '<span class="script-icon">' + (TYPE_ICON[n.type] || '') + '</span>' +
          '<b>' + esc(n.title || 'Untitled') + '</b>' +
          (n.date ? '<span class="script-meta">📅 ' + esc(n.date) + '</span>' : '') +
          (n.beat ? '<span class="script-meta">' + esc(n.beat) + '</span>' : '') +
          (n.id === story.meta.start ? '<span class="script-start">▶ START</span>' : '') +
        '</div>' +
        (cue ? '<div class="script-cue">' + esc(cue) + ':</div>' : '') +
        '<div class="script-body">' + previewHTML(n) + '</div>' +
        (n.type === 'jump' ? '<div class="script-jump">Go to: ' + esc(jumpTo ? jumpTo.title : (jumpTag || '—')) + '</div>' : '') +
        (n.type === 'condition' && n.cond ? '<div class="script-jump">if (' + esc(n.cond) + ') — first open exit wins</div>' : '') +
        (exits.length ? '<div class="script-exits">' + exits.map(function(x){
            return '<div class="script-exit">▸ ' + esc(x.label) +
              (x.to && x.label !== x.to ? '  <i>→ ' + esc(x.to) + '</i>' : '') +
              (x.cond ? '  <i class="script-cond">if ' + esc(x.cond) + '</i>' : '') + '</div>';
          }).join('') + '</div>' : '') +
        '</div>';
    });
    html += '</div>';
  }
  box.innerHTML = html;
  Array.prototype.forEach.call(box.querySelectorAll('.script-scene'), function(s){
    s.onclick = function(){
      var id = s.getAttribute('data-id');
      if (!id) return;
      setMode('map');
      selectNode(id);
      focusNode(id);
    };
  });
}
function renderBeat(){
  var ns = orderedScenes();
  var html = '<div class="sheetbar"><h2>▥ Beat sheet</h2><span class="hint">Every scene with its beat, act, POV and tension — click a row to select it, double-click to open it on the map.</span></div>';
  if (!ns.length){
    $('beatview').innerHTML = html + '<div class="pempty">Nothing here yet — add a scene first.</div>';
    return;
  }
  html += '<div class="sheet-wrap"><table class="beattbl"><thead><tr>' +
    ['#', 'Title', 'Beat', 'Act', 'POV', 'Date', 'Tension', 'Words', 'Status'].map(function(c){
      return '<th' + (c === 'Words' ? ' class="sh-num"' : '') + '>' + c + '</th>';
    }).join('') + '</tr></thead><tbody>';
  ns.forEach(function(n, i){

    var bar = (t === null)
      ? '<span class="bt-tension">—</span>'
      : '<span class="bt-tension">' + '█'.repeat(t) + '░'.repeat(10 - t) + '</span> <span class="bt-tval">' + t + '/10</span>';
    html += '<tr class="brow' + (sel === n.id ? ' on' : '') + '" data-id="' + n.id + '">' +
      '<td class="sh-idx">' + (i + 1) + '</td>' +
      '<td class="bt-title">' + esc(n.title) + '</td>' +
      '<td>' + (n.beat ? '<span class="arc-beat" style="background:' + esc(beatColor(n.beat)) + '">' + esc(n.beat) + '</span>' : '—') + '</td>' +
      '<td>' + esc(n.act || '—') + '</td>' +
      '<td>' + esc(n.pov || '—') + '</td>' +
      '<td>' + esc(n.date || '—') + '</td>' +
      '<td>' + bar + '</td>' +
      '<td class="bt-words">' + words(n.text) + '</td>' +
      '<td>' + esc(n.status || '—') + '</td>' +

  html += '</tbody></table></div>';

}

/* ---------------- stats view ---------------- */
function statCard(label, val){
  return '<div class="stat-card"><b>' + val + '</b><span>' + label + '</span></div>';
}
function renderStats(){
  ensureLib();
  var ns = orderedScenes();
  var ww = ns.map(function(n){ return words(n.text); });
  var total = ww.reduce(function(a, b){ return a + b; }, 0);
  var maxScene = 0, maxI = -1;
  ww.forEach(function(w, i){ if (w > maxScene){ maxScene = w; maxI = i; } });
  var chapters = {};
  ns.forEach(function(n){ var c = String(n.chapter || '').trim() || 'Unchaptered'; chapters[c] = 1; });
  var html = '<div class="sheetbar"><h2>📊 Story statistics</h2><span class="hint">Words across the whole board, cumulative over the scene order.</span></div>';
  if (!ns.length){
    $('statsview').innerHTML = html + '<div class="pempty">Nothing here yet — add a scene first.</div>';
    return;
  }
  html += '<div class="stat-grid">' +
    statCard('Scenes', ns.length) +
    statCard('Total words', total) +
    statCard('Avg words / scene', Math.round(total / ns.length)) +
    statCard('Longest scene', maxI >= 0 ? esc(ns[maxI].title) + ' · ' + maxScene + 'w' : '—') +
    statCard('Endings', ns.filter(function(n){ return n.type === 'ending'; }).length) +
    statCard('Chapters', Object.keys(chapters).length) +
    statCard('Characters', libArr('character').length) +
    statCard('Locations', libArr('location').length) +
    statCard('Items', libArr('item').length) +
    statCard('Variables', libArr('variable').length) +
    '</div>';
  var W = 860, H = 240, P = 36;
  var cum = [], run = 0;
  ww.forEach(function(w){ run += w; cum.push(run); });
  var maxC = Math.max.apply(null, cum.concat(1));
  var stepX = ns.length > 1 ? (W - 2 * P) / (ns.length - 1) : 0;
  function pt(i, c){
    var x = ns.length > 1 ? P + i * stepX : W / 2;
    var y = H - P - (c / maxC) * (H - 2 * P);
    return { x: Math.round(x), y: Math.round(y) };
  }
  var pts = cum.map(function(c, i){ var p = pt(i, c); return p.x + ',' + p.y; }).join(' ');
  var dots = cum.map(function(c, i){ var p = pt(i, c); return '<circle cx="' + p.x + '" cy="' + p.y + '" r="3" fill="#7c6cf0" />'; }).join('');
  html += '<h3 class="stats-h2">Total words over time</h3>' +
    '<div class="stat-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' +
    '<line x1="' + P + '" y1="' + (H - P) + '" x2="' + (W - P) + '" y2="' + (H - P) + '" stroke="#3a4154" stroke-width="1" />' +
    '<line x1="' + P + '" y1="' + P + '" x2="' + P + '" y2="' + (H - P) + '" stroke="#3a4154" stroke-width="1" />' +
    '<text x="' + (P - 6) + '" y="' + (P + 4) + '" text-anchor="end" font-size="10" fill="#8b93a7">' + maxC + '</text>' +
    '<text x="' + (P - 6) + '" y="' + (H - P + 4) + '" text-anchor="end" font-size="10" fill="#8b93a7">0</text>' +
    '<polyline fill="none" stroke="#7c6cf0" stroke-width="2" points="' + pts + '" />' + dots + '</svg></div>';
  var maxW = Math.max.apply(null, ww.concat(1));
  var bw = (W - 2 * P) / ns.length;
  var bars = ns.map(function(n, i){
    var h = Math.round((ww[i] / maxW) * (H - 2 * P));
    return '<rect x="' + Math.round(P + i * bw + 2) + '" y="' + Math.round(H - P - h) + '" width="' + Math.max(1, Math.round(bw - 4)) + '" height="' + h + '" rx="2" fill="' + esc(nodeColor(n)) + '"><title>' + esc(n.title) + ' — ' + ww[i] + ' words</title></rect>';
  }).join('');
  html += '<h3 class="stats-h2">Words per scene</h3>' +
    '<div class="stat-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' +
    '<line x1="' + P + '" y1="' + (H - P) + '" x2="' + (W - P) + '" y2="' + (H - P) + '" stroke="#3a4154" stroke-width="1" />' +
    bars + '</svg></div>';
  $('statsview').innerHTML = html;
}
/* radial outline: drag cards (positions persist), click to edit */
var rdDrag = null;
$('outlineview').addEventListener('pointerdown', function(e){
  var card = e.target.closest ? e.target.closest('.rd-card') : null;
  if (!card) return;
  var kind = card.getAttribute('data-kind'), id = card.getAttribute('data-id');
  var ent = libEntity(kind, id);
  if (!ent) return;
  rdDrag = {
    el: card, kind: kind, id: id, ent: ent,
    cx: e.clientX, cy: e.clientY,
    x: parseFloat(card.style.left) || 0, y: parseFloat(card.style.top) || 0,
    moved: false
  };
  if (e.preventDefault) e.preventDefault();
});
window.addEventListener('pointermove', function(e){
  if (!rdDrag) return;
  var nx = rdDrag.x + (e.clientX - rdDrag.cx);
  var ny = rdDrag.y + (e.clientY - rdDrag.cy);
  rdDrag.ent.ox = nx; rdDrag.ent.oy = ny;
  rdDrag.el.style.left = nx + 'px';
  rdDrag.el.style.top = ny + 'px';
  rdDrag.moved = true;
});
window.addEventListener('pointerup', function(e){
  if (!rdDrag) return;
  var d = rdDrag; rdDrag = null;
  if (d.moved){ pushUndo(); save(); renderOutline(); }
  else selectLib(d.kind, d.id);
});
/* timeline: reorder buttons + row selection */
$('timelineview').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-up],[data-down]') : null;
  if (b){
    var id = b.getAttribute('data-up') || b.getAttribute('data-down');
    tlMove(id, b.getAttribute('data-up') ? -1 : 1);
    return;
  }
  var o = e.target.closest ? e.target.closest('.tl-row') : null;

});
$('timelineview').addEventListener('dblclick', function(e){
  var o = e.target.closest ? e.target.closest('.tl-row') : null;
  if (!o) return;

/* sheet: delegated editing of every field */
$('sheetview').addEventListener('input', function(e){
  var inp = e.target;
  if (!inp || !inp.getAttribute) return;
  var f = inp.getAttribute('data-f');
  if (!f) return;
  var tr = inp.closest ? inp.closest('tr[data-id]') : null;
  if (!tr) return;
  var n = byId(tr.getAttribute('data-id'));
  if (!n) return;
  var v = inp.value;
  pushUndoTyping();
  if (f === 'tension'){
    if (v === '') n.tension = '';
    else {
      var num = Number(v);
      n.tension = (isNaN(num)) ? '' : Math.max(0, Math.min(10, num));
    }
  } else if (f === 'type'){
    n.type = v;
    if (n.type === 'condition') syncCondChoices(n);
    renderNodes();
  } else if (f === 'title'){
    n.title = v;
    syncTextLinks(n);
    renderPassages();
    renderStatus();
  } else if (f === 'text'){
    n.text = v;
    syncTextLinks(n);
    renderStatus();
  } else if (f === 'location'){
    n.location = v;
    renderNodes();   /* the card's 📍 chip follows the edit */
  } else if (f === 'tag'){
    setTags(n, parseTags(v));   /* space-separated input → tag list; the first stays the primary slug */
    renderNodes();
  } else {
    n[f] = v;
  }
  save();
  var wc = tr.querySelector('.sh-words');
  if (wc) wc.textContent = words(n.text);
});
/* sheet: a committed location edit joins the library, same as the Inspector fields */
$('sheetview').addEventListener('change', function(e){
  var inp = e.target;
  if (!inp || !inp.getAttribute) return;
  if (inp.getAttribute('data-f') === 'location' && String(inp.value).trim()) ensureLocationByName(inp.value);

/* ---------------- keyboard ---------------- */
window.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){
    if (!$('ctxmenu').hidden){ hideCtxMenu(); return; }
    if (linkDraft){ linkDraft = null; tempPath = null; renderEdges(); return; }
    if (!$('modal').hidden){ closeModal(); return; }
    if (!$('play').hidden){ $('play').hidden = true; return; }
    if (viewMode !== 'map'){ setMode('map'); return; }
    if (sel || selLink || libSel || multiSel.length){ sel = null; selLink = null; libSel = null; multiSel = []; render(); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')){ e.preventDefault(); saveProject(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'o' || e.key === 'O')){ e.preventDefault(); openProject(); return; }
  if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'f' || e.key === 'F')){ e.preventDefault(); openFindBar(); return; }
  if (findOpen && e.key === 'Escape'){ closeFindBar(); return; }
  var typing = /^(input|textarea|select)$/i.test((e.target.tagName || ''));
  if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'z' || e.key === 'Z')){
    if (!typing){ e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); return; }
  }
  if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key === 'y'){
    if (!typing){ e.preventDefault(); doRedo(); return; }
  }
  if (e.key === 'p' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); openPlayer(); return; }
  if (typing) return;
  /* arrow keys nudge the (multi-)selection — Shift = 10px steps */
  var AK = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (AK[e.key] && viewMode === 'map'){
    var nids = selIds();
    if (nids.length){
      e.preventDefault();
      var st = e.shiftKey ? 10 : 1;
      pushUndoTyping();   /* coalesce a burst of nudges into one undo step */
      nids.forEach(function(id){
        var q = byId(id); if (!q) return;
        q.x += AK[e.key][0] * st; q.y += AK[e.key][1] * st;
        var qel = nodeEls[id];
        if (qel){ qel.style.left = q.x + 'px'; qel.style.top = q.y + 'px'; }
      });
      save(); renderEdges(); renderMinimap();
      return;
    }
  }
  /* F2: rename the selected library entry — focus and select its name field */
  if (e.key === 'F2'){
    e.preventDefault();
    if (libSel && libEntity(libSel.kind, libSel.id)){
      selectLib(libSel.kind, libSel.id);
      var fEl = $('libName');
      if (fEl){ fEl.focus(); fEl.select(); }
    }
    return;
  }
  if (e.key === 'g' || e.key === 'G'){ setMode('map'); return; }
  if (e.key === 'o' || e.key === 'O'){ setMode(viewMode === 'outline' ? 'map' : 'outline'); return; }
  if (e.key === 't' || e.key === 'T'){ setMode(viewMode === 'timeline' ? 'map' : 'timeline'); return; }
  if (e.key === 'c' || e.key === 'C'){ setMode(viewMode === 'characters' ? 'map' : 'characters'); return; }
  if (e.key === 's' || e.key === 'S'){ setMode(viewMode === 'sheet' ? 'map' : 'sheet'); return; }
  if (e.key === 'a' || e.key === 'A'){ setMode(viewMode === 'arc' ? 'map' : 'arc'); return; }
  if (e.key === 'b' || e.key === 'B'){ setMode(viewMode === 'beat' ? 'map' : 'beat'); return; }
  if (e.key === 'r' || e.key === 'R'){ setMode(viewMode === 'script' ? 'map' : 'script'); return; }
  if (e.key === 'e' || e.key === 'E'){ setMode(viewMode === 'playorder' ? 'map' : 'playorder'); return; }
  if (e.key === 'p' || e.key === 'P'){ setMode(viewMode === 'stats' ? 'map' : 'stats'); return; }
  if (e.key === '+' || e.key === '='){ zoomAt(viewport.getBoundingClientRect().left + viewport.clientWidth / 2, viewport.getBoundingClientRect().top + viewport.clientHeight / 2, 1.25); return; }
  if (e.key === '-' || e.key === '_'){ zoomAt(viewport.getBoundingClientRect().left + viewport.clientWidth / 2, viewport.getBoundingClientRect().top + viewport.clientHeight / 2, 0.8); return; }
  if (e.key === 'Delete' || e.key === 'Backspace'){
    if (selLink){ pushUndo(); removeLink(selLink); save(); render(); return; }
    if (multiSel.length){ deleteMulti(); return; }
    if (sel){
      var n = byId(sel);
      if (n){
        var id = n.id;
        confirmAction('node:' + id, 'Press <b>Delete</b> again to confirm removal of <b>' + esc(n.title) + '</b>.', function(){
          pushUndo(); removeNode(id); save(); render();
        });
      }
      return;
    }
    /* Del on a selected library entry — same double-press confirm as nodes */
    if (libSel && libEntity(libSel.kind, libSel.id)){
      var le = libEntity(libSel.kind, libSel.id);
      confirmAction('libdel:' + libSel.kind + ':' + libSel.id,
        'Press <b>Delete</b> again to confirm removal of <b>' + esc(le.name || LIB_KINDS[libSel.kind].label) + '</b> from the library.',
        function(){
          pushUndo(); removeLibEntity(libSel.kind, libSel.id);
          toast(LIB_KINDS[libSel.kind].icon + ' Removed from the library.');
        });
      return;
    }
  }
  if (e.key === 'n' || e.key === 'N'){ addNodeCenter(); return; }
  if (e.key === 'f' || e.key === 'F'){ fitView(); return; }
});
window.addEventListener('beforeunload', saveNow);
window.addEventListener('beforeunload', releaseLock);
/* mobile browsers can kill a tab without ever firing beforeunload — persist when hidden too */
document.addEventListener('visibilitychange', function(){ if (document.hidden) saveNow(); });

/* ---------------- boot ---------------- */
(function boot(){
  try { if (localStorage.getItem('loomlight.theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
  initLock();
  if (!load()) story = sampleStory();
  ensureLib();
  $('storyTitle').value = story.meta.title || '';
  render();
  refreshUndoBtns();
  if (story.nodes.length) fitView();
  restoreProjectHandle();
})();
