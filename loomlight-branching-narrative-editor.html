function initLock(){
  if (claimLock(false)){
    /* clean session — this tab owns the autosave */
  } else {
    openModal('Loomlight may be open in another tab',
      '<div style="padding:18px;line-height:1.75;font-size:14px">This story looks like it is already open in another browser tab. Two tabs autosaving at once can overwrite each other\'s changes — only one tab should own the story.<br /><br /><b>Close the other tab</b>, or take over the session here.</div>' +
      '<div class="row" style="padding:0 18px 18px;gap:8px"><button class="tbtn" id="lockTake">✓ Take over this session</button><button class="tbtn" id="lockReload">↻ Reload this tab</button></div>');
    var t1 = $('lockTake');
    if (t1) t1.onclick = function(){ claimLock(true); lockLost = false; refreshSaveChip(); closeModal(); toast('This tab now owns the autosave session.'); };
    var t2 = $('lockReload');
    if (t2) t2.onclick = function(){ location.reload(); };
  }
  /* heartbeat: keep our lock fresh, notice foreign locks, resume when they expire */
  setInterval(function(){
    var lk = lockState();
    if (lockLost){
      if (!lk || lk.id === TAB_ID || Date.now() - lk.ts >= 6000){
        lockLost = false;
        claimLock(true);
        refreshSaveChip();
        save();  /* resume persisting this tab's state */
      }
      return;
    }
    if (lk && lk.id !== TAB_ID && Date.now() - lk.ts < 6000){
      lockLost = true;
      refreshSaveChip();
      toast('⚠ Another tab took over this story\'s autosave — saving is paused here. Reload this page before you keep editing.');
    } else {
      try { localStorage.setItem(LS_LOCK, JSON.stringify({ id: TAB_ID, ts: Date.now() })); } catch (e) {}
    }
  }, 2000);
}

/* ---------------- undo / redo (storySnapshot-based) ---------------- */
var undoStack = [], redoStack = [], undoTimer = null;
/* ---------------- one shared writer for the story's serialized form ----------------
   undo snapshots, autosave, safety backups and the HTML export all need the
   same JSON.stringify(story). The cache is invalidated at the exact mutation
   choke points that already drop the load-side caches (issues(), find haystacks,
   word count), so every reader and writer of the serialized form stays
   coherent with same-page writes — and unchanged states are stringified once,
   not once per consumer (export-after-save, beforeunload + visibilitychange
   flushes, repeated saveNow calls). Distinct states are still serialized once
   each — an undo snapshot taken before a mutation is legitimately a different
   state than the autosave written after it. */

  if (serializedStoryCache === null) serializedStoryCache = JSON.stringify(story);
  return serializedStoryCache;
}
function storySnapshot(){ return serializedStory(); }
function pushUndo(){
  invalidateStoryCaches();
  var snap = storySnapshot();
  if (undoStack.length && undoStack[undoStack.length - 1] === snap) return;
  undoStack.push(snap);
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
  refreshUndoBtns();
}
/* coalesce rapid typing (text/title edits) into one undo step */
function pushUndoTyping(){
  invalidateStoryCaches();             /* coalescing skips pushUndo(), so drop the memoized caches here too */
  if (undoTimer){ clearTimeout(undoTimer); }

  undoTimer = setTimeout(function(){ undoTimer = null; }, 700);
}
function applySnapshot(snap){
  story = JSON.parse(snap);
  sel = null; selLink = null; multiSel = [];
  save(); render();
}
function doUndo(){
  var cur = storySnapshot();
  while (undoStack.length && undoStack[undoStack.length - 1] === cur) undoStack.pop();
  if (!undoStack.length){ refreshUndoBtns(); toast('Nothing to undo.'); return; }
  redoStack.push(cur);
  applySnapshot(undoStack.pop());
  refreshUndoBtns();
}
function doRedo(){
  var cur = storySnapshot();
  while (redoStack.length && redoStack[redoStack.length - 1] === cur) redoStack.pop();
  if (!redoStack.length){ refreshUndoBtns(); toast('Nothing to redo.'); return; }
  undoStack.push(cur);
  applySnapshot(redoStack.pop());
  refreshUndoBtns();
}
function refreshUndoBtns(){
  var u = $('btnUndo'), r = $('btnRedo');

function uniqueTitle(base){

function addNode(x, y, type, title, text){
  var n = { id: uid(), type: type || 'narrative', title: title || 'Untitled', x: Math.round(x), y: Math.round(y), w: 230, text: text || '' };
  n.tord = story.nodes.reduce(function(m, q){ return Math.max(m, typeof q.tord === 'number' ? q.tord : 0); }, 0) + 1;
  story.nodes.push(n);

/* shift a candidate spot down until it no longer overlaps an existing node */
function freeSpot(x, y){

    return story.nodes.some(function(q){ return Math.abs(q.x - x) < 250 && Math.abs(q.y - y) < 130; });
  }

function removeNode(id){

/* keep graph edges in sync with [[target]] links for existing titles */
function syncTextLinks(node){

  var mine = {};   /* this node's outgoing targets — O(1) lookups instead of a .some() scan per [[target]] */
  story.links.forEach(function(l){ if (l.from === node.id) mine[l.to] = true; });
  for (var i = 0; i < tls.length; i++){
    var t = byTitle(tls[i].target);

/* ---------------- rendering ---------------- */
function applyView(){

  var g = Math.round(26 * view.z);
  viewport.style.backgroundSize = g + 'px ' + g + 'px';
  viewport.style.backgroundPosition = view.x + 'px ' + view.y + 'px';
  $('zoomLabel').textContent = Math.round(view.z * 100) + '%';
  updateMinimapView();

}
function toWorld(cx, cy){

}

/* ---------------- zoom-adaptive cards ----------------

   title + type icon — so dense forests read like dialogue-flow maps; prose,
   chips, portraits and ports return as you zoom back in. The visual collapse
   is CSS (#world.pill); the geometry is JS: nodeW() and re-measured card

  b.style.top = (MM_PAD + (-view.y / view.z - m.minY) * m.s) + 'px';

(function(){
  var mmDrag = false;

    if (!mm._map) return;

    var m = mm._map;
    var wx = (e.clientX - r.left - MM_PAD) / m.s + m.minX;
    var wy = (e.clientY - r.top - MM_PAD) / m.s + m.minY;

/* ---------------- beat ruler ---------------- */
/* ▤ a beat-colored filmstrip pinned to the top of the map: every Beat with

/* ---------------- find scenes (Ctrl+F) ---------------- */
/* live substring search across every authoring field of a scene; matching
   cards stay bright while the rest dim to a ghost, Enter / Shift+Enter cycle
   through the matches, and Esc clears the filter and closes the bar */
var findOpen = false, findMatches = [], findIndex = -1, findDimmed = false;
function findableText(n){
  return [n.title, n.text, tagsOf(n).join(' '), n.beat, n.act, n.chapter, n.pov, n.status, n.character,
          (Array.isArray(n.choices) ? n.choices : []).map(function(c){ return c && c.label ? c.label : ''; }).join(' ')]
    .join(' ');
}
/* one lowercase search haystack per node, cached until the story changes —
   keeps every keystroke and re-render from rebuilding the joined text of the whole story */
var findHaystacks = null;
function findHaystack(i){
  var n = story.nodes[i];
  var h = findHaystacks;
  if (!h || h.length !== story.nodes.length || h[i].n !== n){   /* any swap, add or remove rebuilds the cache */
    h = findHaystacks = story.nodes.map(function(m){ return { n: m, hay: findableText(m).toLowerCase() }; });
  }
  return h[i].hay;
}
function matchesForFind(q){
  q = String(q || '').trim().toLowerCase();
  if (!q) return [];
  var out = [];
  for (var i = 0; i < story.nodes.length; i++)
    if (findHaystack(i).indexOf(q) >= 0) out.push(story.nodes[i]);
  return out;
}
function applyFindDim(precomputed){
  var q = (findOpen && $('findInput')) ? $('findInput').value : '';
  var active = !!String(q).trim();
  if (!active && !findDimmed) return;   /* nothing dimmed and no query — O(1) exit for every re-render */
  var matches = active ? (precomputed || matchesForFind(q)) : [];
  if (active) findMatches = matches;    /* keep the cycling list in step with edits made mid-search */
  var set = {};
  matches.forEach(function(n){ set[n.id] = 1; });
  Object.keys(nodeEls).forEach(function(id){
    nodeEls[id].classList.toggle('find-dim', active && !set[id]);
  });
  /* dim edges unless both ends are part of the match set (labels follow their link);
     link endpoints are indexed once per pass — no per-edge scan of story.links */
  var endpoints = null;
  if (active){
    endpoints = {};
    story.links.forEach(function(l){ endpoints[l.id] = l; });
    story.nodes.forEach(function(n){
      (Array.isArray(n.choices) ? n.choices : []).forEach(function(c, i){
        if (!c || !c.target) return;
        var t = resolveNodeRef(c.target);
        if (t) endpoints['ch:' + n.id + ':' + i] = { from: n.id, to: t.id };
      });
    });
  }
  function dimByLink(el){
    var l = endpoints ? endpoints[el.getAttribute('data-link')] : null;
    el.classList.toggle('find-dim', active && (!l || !set[l.from] || !set[l.to]));
  }
  if (edgesSvg) Array.prototype.forEach.call(edgesSvg.querySelectorAll('.edge-path'), dimByLink);
  var chipBox = $('edgechips');
  if (chipBox) Array.prototype.forEach.call(chipBox.querySelectorAll('.edge-label'), dimByLink);
  findDimmed = active;
}
function updateFindCount(){
  var q = $('findInput') ? $('findInput').value : '';
  if (!String(q).trim()){ $('findCount').textContent = ''; findMatches = []; findIndex = -1; return; }
  if (findIndex < 0 || findIndex >= findMatches.length)
    $('findCount').textContent = findMatches.length + (findMatches.length === 1 ? ' match' : ' matches');
  else
    $('findCount').textContent = (findIndex + 1) + '/' + findMatches.length;
}
function updateFind(){
  findMatches = matchesForFind($('findInput').value);
  findIndex = findMatches.length ? 0 : -1;
  updateFindCount();
  applyFindDim(findMatches);
}
function stepFind(dir){
  if (!findMatches.length) return;
  findIndex = (findIndex + dir + findMatches.length) % findMatches.length;
  var n = findMatches[findIndex];
  if (!byId(n.id)){ updateFind(); if (findMatches.length) stepFind(dir); return; }   /* match deleted mid-search — recompute and retry */
  selectNode(n.id);       /* auto-expands a collapsed arc that owns the scene */
  focusNode(n.id);

}
function openFindBar(){
  if (viewMode !== 'map') setMode('map');
  findOpen = true;
  $('findBar').hidden = false;
  $('findInput').focus();
  $('findInput').select();

}
function closeFindBar(){
  findOpen = false;
  $('findBar').hidden = true;
  applyFindDim();
}
$('findInput').addEventListener('input', updateFind);
$('findInput').addEventListener('keydown', function(e){
  e.stopPropagation();
  if (e.key === 'Enter'){ e.preventDefault(); stepFind(e.shiftKey ? -1 : 1); }
  else if (e.key === 'Escape'){ e.preventDefault(); closeFindBar(); }

$('findPrev').onclick = function(){ stepFind(-1); };
$('findNext').onclick = function(){ stepFind(1); };
$('findClose').onclick = closeFindBar;

/* ---------------- validation ---------------- */
/* issues() walks the whole graph (links, choices, tags, text links) and used to
   be recomputed 3-4x per render cycle (status bar, problems panel, map problem
   dots, help view). The result depends only on `story`, so it is memoized and
   invalidated at every mutation choke point: save(), pushUndo(), pushUndoTyping(). */
var issuesCache = null;
function invalidateIssuesCache(){ issuesCache = null; }
/* everything memoized off `story` drops here — issues() and the find haystacks.
   Called at the same mutation choke points: save(), pushUndo(), pushUndoTyping(). */
function invalidateStoryCaches(){ invalidateIssuesCache(); findHaystacks = null; totalWordsCache = null; serializedStoryCache = null; }
/* total story word count — renderStatus() used to re-split every scene's text
   on every keystroke; this is memoized off `story` like issues() and the find
   haystacks, at the same mutation choke points */
var totalWordsCache = null;
function storyWordCount(){
  if (totalWordsCache !== null) return totalWordsCache;
  var t = 0;
  story.nodes.forEach(function(n){ if (n.type !== 'note') t += words(n.text); });
  totalWordsCache = t;
  return t;
}
function issues(){
  if (issuesCache) return issuesCache;
  var out = [];
  if (!story.meta.start || !byId(story.meta.start)) out.push({ sev: 'err', msg: 'No start node set.', id: null });
  var incoming = {}, referenced = {};
  story.links.forEach(function(l){ incoming[l.to] = (incoming[l.to] || 0) + 1; });
  story.nodes.forEach(function(n){
    textLinks(n.text).forEach(function(t){ var tn = byTitle(t.target); if (tn) referenced[tn.id] = true; });
    (Array.isArray(n.choices) ? n.choices : []).forEach(function(c){
      var t = c && resolveNodeRef(c.target);
      if (t) referenced[t.id] = true;
    });
    /* inspector-wired routes make a scene reachable too — a Jump's target,
       and a Condition node's then/else hand-over */
    if (n.type === 'jump' && n.jumpTo){ var j = resolveNodeRef(n.jumpTo); if (j) referenced[j.id] = true; }
    if (n.type === 'condition'){
      [n.then, n.else].forEach(function(r){
        var t = r && resolveNodeRef(r);
        if (t) referenced[t.id] = true;
      });
    }
  });
  /* every tag a scene carries must be a unique single-word slug */
  var tagSeen = {};
  story.nodes.forEach(function(n){
    tagsOf(n).forEach(function(tg){
      if (!/^[a-z0-9][a-z0-9-]*$/i.test(tg))
        out.push({ sev: 'warn', msg: '\u201c' + n.title + '\u201d has an odd tag \u201c' + tg + '\u201d — use single-word slugs (letters, digits, dashes).', id: n.id });
      else if (tagSeen[tg.toLowerCase()])
        out.push({ sev: 'err', msg: 'Tag \u201c' + tg + '\u201d is used by more than one scene — tags must be unique. To group scenes, use an Arc instead (inspector → Arc, or the 🗺 Arcs sidebar tab).', id: n.id });
      else tagSeen[tg.toLowerCase()] = true;
    });
  });
  /* choice / jump targets must resolve (tag, id or title) */
  story.nodes.forEach(function(n){
    var refs = [];
    (Array.isArray(n.choices) ? n.choices : []).forEach(function(c){ if (c && c.target) refs.push(c.target); });
    if (n.type === 'jump' && n.jumpTo) refs.push(n.jumpTo);
    refs.forEach(function(r){
      if (!resolveNodeRef(r))
        out.push({ sev: 'err', msg: '\u201c' + n.title + '\u201d points at unknown tag/id \u201c' + r + '\u201d.', id: n.id });
    });
  });
  story.nodes.forEach(function(n){
    if (n.id !== story.meta.start && !incoming[n.id] && !referenced[n.id])
      out.push({ sev: 'warn', msg: '“' + n.title + '” is unreachable (nothing links to it).', id: n.id });
    if (outCount(n) === 0 && n.type === 'narrative')
      out.push({ sev: 'warn', msg: '“' + n.title + '” is a dead end (narrative with no exits).', id: n.id });
    textLinks(n.text).forEach(function(t){
      if (!byTitle(t.target))
        out.push({ sev: 'err', msg: '“' + n.title + '” links to missing scene “' + t.target + '”.', id: n.id });
    });
    if (n.type === 'note')
      out.push({ sev: 'warn', msg: '“' + n.title + '” is a note — excluded from reader flow by convention.', id: n.id });
  });
  /* @mentions must resolve to a library character, location or item — unknown
     ones render as plain text instead of tinted chips, so flag them */
  story.nodes.forEach(function(n){
    libMentionIssues(n.text).forEach(function(nm){
      out.push({ sev: 'warn', msg: '“' + n.title + '” has an @mention “@' + nm + '” that matches no character, location or item.', id: n.id });
    });
  });
  /* a scene's location must resolve to a library location — otherwise the card chip
     and the play-mode line fall back to plain text with no library backing */
  story.nodes.forEach(function(n){
    var ln = String(n.location || '').trim();
    if (ln && !locationByName(ln))
      out.push({ sev: 'warn', msg: '“' + n.title + '” is set at location “' + ln + '”, which matches no location in the library.', id: n.id });
  });
  /* @Character Attribute checks (connection conditions, Condition nodes and
     {{when:}} blocks) must resolve to a character and one of its attributes —
     otherwise the check silently reads as unmet */
  var attrCheckIssue = function(owner, expr, nodeId){
    var am = String(expr || '').match(/^\s*!?\s*@\s*(.+)$/);
    if (!am) return;
    var pc = parseAttrCheck(am[1]);
    if (!pc || !pc.attr){
      /* no library character prefixes the expression — unknown character (or malformed) */
      out.push({ sev: 'warn', msg: '“' + owner + '” has an attribute check “@' + String(am[1]).trim() + '” that matches no character in the library — expected “@Character Attribute”.', id: nodeId });
      return;
    }
    if (characterAttribute(pc.ch, pc.attr) === undefined)
      out.push({ sev: 'warn', msg: '“' + owner + '” checks attribute “' + pc.attr + '”, which character “' + pc.ch + '” does not have — the check always reads as unmet.', id: nodeId });
  };
  /* dice-looking fragments must be valid NdM notation — otherwise the roll
     silently reads as unmet (conditions) or as literal text (effects) */
  var diceCheckIssue = function(owner, expr, nodeId){
    var dr = /(?:^|[^0-9a-z_])((?:\d+d\d*|\bd\d+)(?:\s*[+-]\s*\d+)?)([0-9a-z_]+)?/gi, dm;
    while ((dm = dr.exec(String(expr || '')))){
      var cand = dm[1], junk = dm[2];   /* trailing word chars — “2d6q” looks like a roll but never parses */
      if (junk || !parseDiceNotation(cand))
        out.push({ sev: 'warn', msg: '“' + owner + '” has a dice roll “' + (junk ? cand + junk : cand).trim() + '” that isn\u2019t valid notation — expected NdM with an optional +N / -N, e.g. 2d6 or d20+3. A malformed roll reads as not met.', id: nodeId });
    }
  };
  /* presence checks must name a library character — otherwise present(Name)
     always reads as unmet, exactly like an unknown @character */
  var presentCheckIssue = function(owner, expr, nodeId){
    var pre = /(?:^|[^\w)])(?:present|here)\s*\(\s*([^()]+?)\s*\)/g, mm;
    while ((mm = pre.exec(String(expr || '')))){
      if (!characterByName(mm[1].trim()))
        out.push({ sev: 'warn', msg: '\u201c' + owner + '\u201d checks the presence of \u201c' + mm[1].trim() + '\u201d, which matches no character in the library — the check always reads as unmet. (Scenes with a Character, and NPC scenes, put that character on stage when the reader arrives.)', id: nodeId });
    }
  };
  story.links.forEach(function(l){
    var src = byId(l.from);
    if (l.cond && src){ attrCheckIssue(src.title, l.cond, src.id); diceCheckIssue(src.title, l.cond, src.id); presentCheckIssue(src.title, l.cond, src.id); }
  });
  story.nodes.forEach(function(n){
    /* entry requirements and per-choice gates validate like any other condition */
    if (n.req){ attrCheckIssue(n.title, n.req, n.id); diceCheckIssue(n.title, n.req, n.id); presentCheckIssue(n.title, n.req, n.id); }
    (Array.isArray(n.choices) ? n.choices : []).forEach(function(c){
      if (c && c.cond){ attrCheckIssue(n.title, c.cond, n.id); diceCheckIssue(n.title, c.cond, n.id); presentCheckIssue(n.title, c.cond, n.id); }
    });
    if (n.type === 'condition' && n.cond){ attrCheckIssue(n.title, n.cond, n.id); diceCheckIssue(n.title, n.cond, n.id); presentCheckIssue(n.title, n.cond, n.id); }
    if (n.type === 'action')
      String(n.text || '').split('\n').forEach(function(line){
        var em = line.match(/^\s*(?:set\s+)?([A-Za-z_]\w*)\s*(\+=|-=|=)\s*(.+?)\s*$/);
        if (em) diceCheckIssue(n.title, em[3], n.id);   /* effect values can be dice: `roll = 2d6` */
      });
    var whenRe = /\{\{when:((?:[^{}]|\}(?!\}))*)\}\}/g, wm;
    while ((wm = whenRe.exec(String(n.text || '')))){ attrCheckIssue(n.title, unescEnt(wm[1]), n.id); diceCheckIssue(n.title, unescEnt(wm[1]), n.id); presentCheckIssue(n.title, unescEnt(wm[1]), n.id); }
  });

  var stReq = byId(story.meta.start);

    out.push({ sev: 'warn', msg: 'The start scene “' + stReq.title + '” carries an entry requirement — new playthroughs open here regardless, so the gate only matters for entrances reached later.', id: stReq.id });
  libArr('character').forEach(function(c){
    if (!c || !c.name) return;
    libMentionIssues(c.encounter).forEach(function(nm){
      out.push({ sev: 'warn', msg: 'Character “' + c.name + '” has an @mention “@' + nm + '” that matches no character, location or item.', id: null });
    });
  });
  story.links.forEach(function(l){
    if (!byId(l.from) || !byId(l.to)) out.push({ sev: 'err', msg: 'Dangling link in graph data.', id: null });
  });
  issuesCache = out;
  return out;
}

/* ---------------- status bar ---------------- */
function renderStatus(){
  var totalWords = storyWordCount();
  var iss = issues();
  var errs = iss.filter(function(i){ return i.sev === 'err'; }).length;
  var warns = iss.length - errs - iss.filter(function(i){ return i.msg.indexOf('note') >= 0; }).length;
  var html = '';
  html += '<span class="stat-chip">' + story.nodes.length + ' nodes</span>';
  html += '<span class="stat-chip">' + story.links.length + ' links</span>';
  html += '<span class="stat-chip">' + totalWords + ' words</span>';
  var endings = story.nodes.filter(function(n){ return n.type === 'ending'; }).length;
  if (endings) html += '<span class="stat-chip">' + endings + ' ending' + (endings > 1 ? 's' : '') + '</span>';
  if (multiSel.length) html += '<span class="stat-chip">▣ ' + selIds().length + ' selected</span>';
  html += '<span class="stat-chip"><label><input type="checkbox" id="snapChk"' + (snapOn ? ' checked="checked"' : '') + ' /> snap</label></span>';
  html += '<span class="stat-chip" id="coordChip" title="Cursor position in world coordinates">—</span>';
  html += '<span class="stat-chip' + ((saveBroken || lockLost) ? ' warn' : '') + '" id="saveChip" title="' + (lockLost ? 'Another tab owns the autosave — reload to take it back' : 'Story, layout and zoom autosave to this browser (format v' + SAVE_V + ' · safety backups rotate automatically)') + '">' + (lockLost ? '⏸ autosave paused' : (saveBroken ? '⚠ autosave off' : '✓ autosave')) + '</span>';
  if (errs || warns) html += '<span class="stat-chip warn" id="warnChip" title="Open the Problems panel">' + (errs ? '⚠ ' + errs + ' error' + (errs > 1 ? 's' : '') : '') + (errs && warns ? ' · ' : '') + (warns ? '⚠ ' + warns + ' warning' + (warns > 1 ? 's' : '') : '') + ' ▸</span>';
  else html += '<span class="stat-chip" id="warnChip" title="Open the Problems panel">✓ all clear ▸</span>';
  statusbar.innerHTML = html;
  var chk = $('snapChk');
  if (chk) chk.onchange = function(){ snapOn = chk.checked; save(); };
  var wc = $('warnChip');
  if (wc) wc.onclick = toggleProblems;
  renderProblems();
  refreshProbDots();
}
/* ---------------- live Problems panel (persistent, click-to-jump) ---------------- */
var probsOpen = false;

function renderProblems(){

    '<label><input type="checkbox" data-pf="notes"' + (probFilter.notes ? ' checked="checked"' : '') + ' />note notices</label>' +
    '<span class="tbtn" id="probClose" title="Hide the Problems panel">✕</span></div><div id="prob-list"></div>';
  p.innerHTML = html;

    };

/* ⚖ the tier editor — one ladder per attribute name, shared by the whole story.
   Opened from a character's attribute row (⚖ button); every tiered attribute
   gains a sortable column in the 🤝 Relationships roster (Char view) and its
   labels become usable in @Character Attribute conditions */
function openTierEditor(attr){
  var attrName = String(attr || '').trim();
  if (!attrName) return;
  var key = tierKeyOf(attrName);
  if (!story.tiers || typeof story.tiers !== 'object' || Array.isArray(story.tiers)) story.tiers = {};
  function draw(){
    /* re-renders the ladder rows and re-binds their inputs — every mutation calls
       draw() again so the modal always mirrors story.tiers[key] */
    var tl = Array.isArray(story.tiers[key]) ? story.tiers[key] : [];
    $('tierRows').innerHTML = tl.map(function(r, i){
      return '<div class="choicerow">' +
        '<input class="fld mono" data-tmin="' + i + '" value="' + esc(String(r.min)) + '" placeholder="min" title="Minimum value that reaches this rung" style="width:70px;flex:none" />' +
        '<input class="fld" data-tlbl="' + i + '" value="' + esc(String(r.label || '')) + '" placeholder="Label (e.g. Confidante)" style="flex:1" />' +
        '<button class="tbtn" data-tx="' + i + '" title="Remove tier">✕</button>' +
      '</div>';
    }).join('') || '<div class="hint">No tiers yet — add the first rung, e.g. min 0 → Stranger.</div>';
    Array.prototype.forEach.call($('tierRows').querySelectorAll('[data-tmin]'), function(inp){
      inp.oninput = function(){
        pushUndoTyping();
        if (story.tiers[key]) story.tiers[key][Number(inp.getAttribute('data-tmin'))].min = Number(inp.value) || 0;
        save();
      };
    });
    Array.prototype.forEach.call($('tierRows').querySelectorAll('[data-tlbl]'), function(inp){
      inp.oninput = function(){
        pushUndoTyping();
        if (story.tiers[key]) story.tiers[key][Number(inp.getAttribute('data-tlbl'))].label = inp.value;
        save();
      };
    });
    Array.prototype.forEach.call($('tierRows').querySelectorAll('[data-tx]'), function(b){
      b.onclick = function(){
        pushUndo();
        story.tiers[key].splice(Number(b.getAttribute('data-tx')), 1);
        if (!story.tiers[key].length) delete story.tiers[key];
        save(); draw();
      };
    });
  }
  openModal('⚖ ' + esc(attrName) + ' — tier table',
    '<div class="hint" style="margin-bottom:10px">A ladder every character&#39;s <b>' + esc(attrName) + '</b> shares — each rung is a <b>minimum value</b> and the <b>story label</b> it reads as (e.g. 40 → Friend, 60 → Close Friend). Gate scenes and choices with <code>@Character ' + esc(attrName) + ' == Label</code>: <code>==</code> / <code>!=</code> match the label, <code>&gt;=</code> / <code>&lt;</code> compare rungs; plain numbers keep working. The <b>🤝 Relationships</b> roster in the 📇 Char view gains a sortable <b>' + esc(attrName) + '</b> column.</div>' +
    '<div id="tierRows"></div>' +
    '<div class="row" style="margin-top:8px"><button class="tbtn" id="tierAdd" style="flex:1">＋ Add tier</button></div>');
  draw();
  $('tierAdd').onclick = function(){
    pushUndo();
    var tl = story.tiers[key] || (story.tiers[key] = []);
    var lastMin = tl.length ? Math.max.apply(null, tl.map(function(r){ return Number(r.min) || 0; })) : -10;
    tl.push({ min: lastMin + 10, label: '' });   /* new rung lands a decade above the current top; an empty ladder starts at 0 */
    save(); draw();
  };
}

      '<div class="hint" style="margin-top:6px">⚙ The reader only gets this connection while the condition holds — evaluated on reaching the source scene, same syntax as Condition nodes (empty = always). Variable conditions show a ⚙ badge; <code>@Character Attribute</code> skill checks (e.g. <code>@The Doorkeeper Patience &gt;= 7</code>) show a ⚔ badge and read the character\'s attribute grid; dice conditions (<code>playerStr &gt; d20</code>) show a 🎲 badge and re-roll every time the gate is evaluated; presence checks (<code>present(The Doorkeeper)</code>) show a 👤 badge and read who\'s on stage — scenes with a Character (and NPC scenes) put that character on stage when the reader arrives.</div>' +

/* ---------------- selection ---------------- */
/* selection helpers — `sel` is the primary selection; multiSel holds the extra multi-selected ids */
function isSel(id){ return id === sel || multiSel.indexOf(id) >= 0; }
function selIds(){
  var out = [], seen = {};
  if (sel && byId(sel)){ out.push(sel); seen[sel] = 1; }
  multiSel.forEach(function(id){ if (!seen[id] && byId(id)){ out.push(id); seen[id] = 1; } });
  return out;
}
function toggleMulti(id){
  var i = multiSel.indexOf(id);
  if (i >= 0){
    multiSel.splice(i, 1);
    if (sel === id) sel = multiSel.length ? multiSel[multiSel.length - 1] : null;
  } else {
    if (sel && sel !== id && multiSel.indexOf(sel) < 0) multiSel.push(sel); /* keep the old primary in the set */
    multiSel.push(id);
    sel = id;
  }
  if (multiSel.length === 1 && sel === multiSel[0]) multiSel = []; /* a trivial selection collapses to a plain one */
  selLink = null; libSel = null;
}
function deleteMulti(){
  var mids = selIds();
  if (!mids.length) return;
  confirmAction('multidel:' + mids.length, 'Press <b>Delete</b> again to confirm removal of <b>' + mids.length + '</b> selected scenes.', function(){
    pushUndo();
    mids.forEach(function(id){ removeNode(id); });
    sel = null; selLink = null; multiSel = [];
    save(); render();
  });
}
function selectNode(id){
  var sn = byId(id);
  if (sn && sn.arc){ var sa = arcById(sn.arc); if (sa && sa.collapsed){ sa.collapsed = false; } }
  sel = id; selLink = null; libSel = null; multiSel = [];
  renderNodes(); renderEdges(); renderPassages(); renderInspector(); renderLibrary();
  if (viewMode !== 'map') renderActiveView();
}
function selectLink(id){
  selLink = id; sel = null; libSel = null; multiSel = [];
  renderNodes(); renderEdges(); renderInspector(); renderLibrary();
}
/* ---------------- inline connection-label editor (double-click an edge / its chip) ---------------- */
var edgeEdit = null;
function openEdgeEditor(linkId, clientX, clientY){
  var l = null;
  for (var i = 0; i < story.links.length; i++) if (story.links[i].id === linkId) l = story.links[i];
  if (!l) return;
  closeEdgeEditor();
  var r = viewport.getBoundingClientRect();
  var inp = document.createElement('input');
  inp.className = 'edge-edit';
  inp.value = l.label || '';
  inp.placeholder = 'Label — **bold**, *italic*, `code`…';
  inp.style.left = Math.max(6, clientX - r.left - 105) + 'px';
  inp.style.top = Math.max(6, clientY - r.top - 34) + 'px';
  inp.addEventListener('keydown', function(e){
    e.stopPropagation();
    if (e.key === 'Enter') commitEdgeEditor();
    else if (e.key === 'Escape') closeEdgeEditor();
  });
  inp.addEventListener('blur', function(){ commitEdgeEditor(); });
  edgeEdit = { el: inp, linkId: linkId, old: l.label || '' };
  viewport.appendChild(inp);

function commitEdgeEditor(){

  var l = null;

  var v = ed.el.value;
  ed.el.remove();

function closeEdgeEditor(){

function focusNode(id){
  var n = byId(id); if (!n) return;

  var r = viewport.getBoundingClientRect();
  var z = Math.min(1.4, Math.max(0.4, Math.min(r.width / (w + 420), r.height / (h + 320))));
  view.z = z;
  view.x = r.width / 2 - (n.x + w / 2) * z;
  view.y = r.height / 2 - (n.y + h / 2) * z;

/* ---------------- gestures: pan, zoom, drag nodes, link ports ---------------- */
var pan = null, nodeDrag = null, linkDraft = null, rubber = null, frameDrag = null;
/* ---------------- rubber-band multi-select ---------------- */
function drawRubber(){
  var r = $('rubberbox');
  if (!r){ r = document.createElement('div'); r.id = 'rubberbox'; world.appendChild(r); }
  var x = Math.min(rubber.x0, rubber.x1), y = Math.min(rubber.y0, rubber.y1);
  var w = Math.abs(rubber.x1 - rubber.x0), h = Math.abs(rubber.y1 - rubber.y0);
  r.style.display = 'block';
  r.style.left = x + 'px'; r.style.top = y + 'px'; r.style.width = w + 'px'; r.style.height = h + 'px';
  /* live preview: outline the nodes the box currently covers */
  story.nodes.forEach(function(n){
    var el = nodeEls[n.id]; if (!el) return;
    var inside = n.x + nodeW(n) > x && n.x < x + w && n.y + nodeH(n, el) > y && n.y < y + h;
    el.classList.toggle('rband', inside);
  });
}
function finishRubber(){
  var add = rubber.add;
  var r = $('rubberbox');
  if (r) r.style.display = 'none';
  var x = Math.min(rubber.x0, rubber.x1), y = Math.min(rubber.y0, rubber.y1);
  var w = Math.abs(rubber.x1 - rubber.x0), h = Math.abs(rubber.y1 - rubber.y0);
  rubber = null;
  story.nodes.forEach(function(n){ var el = nodeEls[n.id]; if (el) el.classList.remove('rband'); });
  var ids = [];
  if (w > 4 || h > 4){
    story.nodes.forEach(function(n){
      var nh = nodeH(n, el);
      if (n.x + nodeW(n) > x && n.x < x + w && n.y + nh > y && n.y < y + h) ids.push(n.id);
    });
  }
  if (!ids.length) return;
  if (!add){ sel = null; multiSel = []; }   /* Shift+drag replaces · Ctrl/Cmd+drag extends */
  ids.forEach(function(id){ if (multiSel.indexOf(id) < 0 && id !== sel) multiSel.push(id); });
  if (!sel || multiSel.indexOf(sel) < 0) sel = ids[ids.length - 1];
  if (multiSel.length === 1 && sel === multiSel[0]) multiSel = []; /* single hit = plain selection */
  renderNodes(); renderEdges(); renderInspector(); renderPassages();
}
viewport.addEventListener('pointerdown', function(e){
  var port = e.target.closest ? e.target.closest('.port') : null;

  var hit = e.target.closest ? e.target.closest('.hit, .edge-label') : null;

  if (port && port.classList.contains('out') && nodeEl){
    e.preventDefault();
    var nid = nodeEl.getAttribute('data-id');

  }

  var frameEl = e.target.closest ? e.target.closest('.frame') : null;

    if (!fa) return;

    }

  }
  if (nodeEl){

        /* plain press on part of the multi-selection: keep it for a batch drag — collapse only on a plain click */
      } else selectNode(id);

      var pw = toWorld(e.clientX, e.clientY);
      var starts = null;
      var sids = selIds();
      if (sids.length > 1 && sids.indexOf(id) >= 0){
        starts = {};
        sids.forEach(function(sid){ var q = byId(sid); if (q) starts[sid] = { x: q.x, y: q.y }; });
      }
      nodeDrag = { id: id, dx: pw.x - nd.x, dy: pw.y - nd.y, moved: false, starts: starts,
                   keepMulti: !e.ctrlKey && !e.metaKey && !e.shiftKey && sids.length > 1 && sids.indexOf(id) >= 0 };

  }

    var p0 = toWorld(e.clientX, e.clientY);
    rubber = { x0: p0.x, y0: p0.y, x1: p0.x, y1: p0.y, add: e.ctrlKey || e.metaKey };
    e.preventDefault();
    return;
  }
  /* background: pan */
  pan = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
  viewport.classList.add('panning');
});
window.addEventListener('pointermove', function(e){
  if (rubber){
    var rp = toWorld(e.clientX, e.clientY);
    rubber.x1 = rp.x; rubber.y1 = rp.y;
    drawRubber();
    return;
  }
  if (pan){
    var dx = e.clientX - pan.x, dy = e.clientY - pan.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) pan.moved = true;
    if (pan.moved){ view.x = pan.vx + dx; view.y = pan.vy + dy; applyView(); }
    return;
  }
  if (frameDrag){
    var fa2 = arcById(frameDrag.id);
    if (!fa2){ frameDrag = null; return; }
    if (!frameDrag.moved && Math.abs(e.clientX - frameDrag.cx) + Math.abs(e.clientY - frameDrag.cy) > 3){
      frameDrag.moved = true; pushUndo();
    }
    if (frameDrag.moved){
      var fdx = (e.clientX - frameDrag.cx) / view.z, fdy = (e.clientY - frameDrag.cy) / view.z;
      frameDrag.starts.forEach(function(s){
        var q = byId(s.id); if (!q) return;
        var nx = s.x + fdx, ny = s.y + fdy;
        if (snapOn){ nx = Math.round(nx / 10) * 10; ny = Math.round(ny / 10) * 10; }
        q.x = Math.round(nx); q.y = Math.round(ny);
        var qel = nodeEls[s.id];
        if (qel){ qel.style.left = q.x + 'px'; qel.style.top = q.y + 'px'; }
      });
      renderEdges();   /* also refreshes frame bounds live */
    }
    return;
  }
  if (nodeDrag){
    var n = byId(nodeDrag.id);
    if (!n){ nodeDrag = null; return; }
    var p = toWorld(e.clientX, e.clientY);
    if (!nodeDrag.moved){ nodeDrag.moved = true; pushUndo(); }
    var nx = p.x - nodeDrag.dx, ny = p.y - nodeDrag.dy;
    if (snapOn){ nx = Math.round(nx / 10) * 10; ny = Math.round(ny / 10) * 10; }
    n.x = Math.round(nx); n.y = Math.round(ny);
    /* multi-selection: carry the whole selection along, keeping relative offsets */
    if (nodeDrag.starts){
      var mdx = n.x - nodeDrag.starts[nodeDrag.id].x, mdy = n.y - nodeDrag.starts[nodeDrag.id].y;
      Object.keys(nodeDrag.starts).forEach(function(sid){
        if (sid === nodeDrag.id) return;
        var q = byId(sid); if (!q) return;
        q.x = Math.round(nodeDrag.starts[sid].x + mdx);
        q.y = Math.round(nodeDrag.starts[sid].y + mdy);
        var qel = nodeEls[sid];
        if (qel){ qel.style.left = q.x + 'px'; qel.style.top = q.y + 'px'; }
      });
    }
    var el = nodeEls[n.id];
    if (el){ el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
    nodeDrag.moved = true;
    renderEdges();
    return;
  }
  if (linkDraft){
    var p2 = toWorld(e.clientX, e.clientY);
    linkDraft.x2 = p2.x; linkDraft.y2 = p2.y;
    var flip = p2.x < linkDraft.x1;
    var dx2 = Math.max(60, Math.abs(p2.x - linkDraft.x1) * 0.42);
    tempPath = '<path class="temp-path" d="M' + linkDraft.x1 + ' ' + linkDraft.y1 +
      ' C' + (linkDraft.x1 + (flip ? -dx2 : dx2)) + ' ' + linkDraft.y1 +
      ' ' + (p2.x + (flip ? dx2 : -dx2)) + ' ' + p2.y + ' ' + p2.x + ' ' + p2.y + '"></path>';
    renderEdges();
    /* highlight drop target */
    var over = document.elementFromPoint(e.clientX, e.clientY);
    var target = over && over.closest ? over.closest('.node') : null;
    story.nodes.forEach(function(x){ if (nodeEls[x.id]) nodeEls[x.id].classList.remove('link-target'); });
    if (target && target.getAttribute('data-id') !== linkDraft.from) target.classList.add('link-target');
  }
});
window.addEventListener('pointerup', function(e){
  if (rubber){ finishRubber(); return; }
  if (frameDrag){
    if (frameDrag.moved) save();
    frameDrag = null;
    return;
  }
  if (pan){
    viewport.classList.remove('panning');
    if (!pan.moved && e.button === 0 && (e.target === viewport || e.target === world)){
      sel = null; selLink = null; multiSel = [];
      renderNodes(); renderEdges(); renderPassages(); renderInspector();
    }
    pan = null; save();
    return;
  }
  if (nodeDrag){
    if (nodeDrag.moved) save();
    else if (nodeDrag.keepMulti) selectNode(nodeDrag.id); /* plain click — collapse the multi-selection to this node */
    nodeDrag = null;
    return;
  }
  if (linkDraft){
    story.nodes.forEach(function(x){ if (nodeEls[x.id]) nodeEls[x.id].classList.remove('link-target'); });
    var over = document.elementFromPoint(e.clientX, e.clientY);

    if (target){
      var tid = target.getAttribute('data-id');
      if (tid !== linkDraft.from){
        pushUndo();

      var nn = addNode(spd.x, spd.y, 'narrative', 'Untitled', '');
      story.links.push({ id: uid(), from: linkDraft.from, to: nn.id, label: '' });
      sel = nn.id; selLink = null; multiSel = [];
      save(); render();
      toast('New scene created &amp; connected.');
      var tEl2 = $('ndTitle');
      if (tEl2){ tEl2.focus(); tEl2.select(); }
    }
    linkDraft = null; tempPath = null;
    renderEdges();
  }
});
viewport.addEventListener('wheel', function(e){
  e.preventDefault();
  var f = Math.exp(-e.deltaY * 0.0012);
  zoomAt(e.clientX, e.clientY, f);
}, { passive: false });
function zoomAt(cx, cy, f){
  var r = viewport.getBoundingClientRect();
  var nz = Math.min(2.5, Math.max(0.2, view.z * f));
  var k = nz / view.z;
  var mx = cx - r.left, my = cy - r.top;
  view.x = mx - (mx - view.x) * k;
  view.y = my - (my - view.y) * k;
  view.z = nz;
  applyView();
}
viewport.addEventListener('dblclick', function(e){

    var p = toWorld(e.clientX, e.clientY);

function fitView(){
  if (!story.nodes.length) return;
  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  story.nodes.forEach(function(n){
    var w = nodeW(n), h = nodeH(n, nodeEls[n.id]);
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + w); maxY = Math.max(maxY, n.y + h);
  });
  var r = viewport.getBoundingClientRect();
  var z = Math.min(1.5, Math.max(0.2, Math.min((r.width - 80) / (maxX - minX), (r.height - 80) / (maxY - minY))));
  view.z = z;
  view.x = (r.width - (maxX - minX) * z) / 2 - minX * z;
  view.y = (r.height - (maxY - minY) * z) / 2 - minY * z;
  applyView(); save();
}
function tidyLayout(){
  pushUndo();
  var startId = story.meta.start && byId(story.meta.start) ? story.meta.start : (story.nodes[0] && story.nodes[0].id);
  var depth = {}, queue = [], placed = 0;
  story.nodes.forEach(function(n){ depth[n.id] = -1; });
  if (startId){ depth[startId] = 0; queue.push(startId); }
  while (queue.length){
    var id = queue.shift();
    var n = byId(id);
    if (!n) continue;
    n.x = 80 + depth[id] * 300;
    n.y = 60 + (placed++ % Math.max(1, Math.ceil(story.nodes.length / 6))) * 160;
    linksOf(id).forEach(function(l){
      if (depth[l.to] === -1){ depth[l.to] = depth[id] + 1; queue.push(l.to); }
    });
    textLinks(n.text).forEach(function(t){
      var tn = byTitle(t.target);
      if (tn && depth[tn.id] === -1){ depth[tn.id] = depth[id] + 1; queue.push(tn.id); }
    });
  }
  /* unplaced (unreachable) nodes go to the far right */
  var col = 0;
  story.nodes.forEach(function(n){
    if (depth[n.id] === -1){
      n.x = 80 + (startId ? 300 * 6 : 0) + col * 300;
      n.y = 60 + col * 60;
      col++;
    }
  });
  save(); render(); fitView();
  toast('Map tidied — layered from the start node.');
}

    '<tr><td><b style="color:#7c3aed">⚙ Condition</b></td><td>if/else branch — set an expression like <code>has_key == true</code>, then pick where each outcome goes; <code>@Character Attribute</code> reads a skill check from the library, and dice notation (<code>d20 &gt;= 15</code>, <code>playerStr &gt; d20</code>) re-rolls on every evaluation</td></tr>' +
    '<tr><td><b style="color:#0891b2">↪ Jump</b></td><td>Continues at another scene by id — chapter transitions</td></tr>' +
    '<tr><td><b style="color:#e06a75">◆ Ending</b></td><td>Terminal outcomes (play mode marks them “The End”)</td></tr>' +
    '<tr><td><b style="color:#ca8a04">✎ Note</b></td><td>Author comments — kept out of the word count and the reader flow</td></tr>' +
    '<tr><td><b style="color:#166534">▮ Text</b></td><td>Ordinary free-form prose — [[links]] work as choices, same as Narrative</td></tr>' +
    '<tr><td><b style="color:#15803d">▤ Exposition</b></td><td>Narrator descriptions, stage directions, environmental storytelling — [[links]] work as choices, same as Narrative; assign a <b>Narrative Voice</b> from the library to tint &amp; label the scene · optional <b>⚔ Encounter sub-type</b> attaches the extra fields <i>Threat, Exploration focus, Reward</i> (defaults pre-filled) plus the tag <i>exploration</i> — all editable</td></tr></table>' +
    '<p style="margin:6px 0 2px"><b>Type accents.</b> Every card carries a structural cue: <b style="color:#ca8a04">✎ Note</b> looks like a sticky amber Post-it (tilted — it straightens when you hover), <b style="color:#b91c1c">● NPC</b> and <b style="color:#0e7490">◈ Choice</b> have a 4px left stripe (in the speaker&#39;s / type color), <b style="color:#1d4ed8">▶ Player</b> has a 4px top stripe plus a serif prose body. A custom color or an NPC&#39;s speaker color re-tints the stripe automatically.</p>' +
    '<h3>Common fields (every node)</h3>' +
    '<table><tr><th>Field</th><th>Use</th></tr>' +
    '<tr><td><b>Title</b></td><td>The headline of the scene</td></tr>' +
    '<tr><td><b>Tags</b></td><td>One or more single-word slugs, space-separated (e.g. <code>ch3-tavern dream</code>) — exported as a Twee 3 tag block <code>[ch3-tavern dream]</code>. The <b>first</b> tag is the primary: unique per story, used as a jump / choice target so links survive retitles; the tags after it are free grouping labels. All show as #chips on the card head and in the Timeline</td></tr>' +
    '<tr><td><b>Cover image</b></td><td>Optional scene art (image URL or 📁-picked local file stored as a <code>data:</code>URI) — banner under the title on the map, backdrop in Play mode &amp; exported HTML, thumbnail in the Arc / Timeline views. URLs keep saves small; data-URIs are self-contained but bloat the file — the editor warns past ~400 KB</td></tr>' +
    '<tr><td><b>Arc</b></td><td>A named scene group (e.g. <i>Act II — The Road</i>) — pick it from the dropdown, which sits right under the Markdown text; scenes of one arc are listed together in the <b>🗺 Arcs</b> sidebar tab (timeline order) and chip-marked on cards and in the arc view. Create, rename or delete arcs in that tab</td></tr>' +
    '<tr><td><b>Location</b></td><td>Where the scene takes place — pick a 📍 location from the library (typing a new name and committing adds it to the library automatically; a suggestion dropdown lists existing locations); its color tints the 📍 chip on the card foot and the SCENE slug above the prose in Play mode, and it has a column in the Sheet view. Renaming the location follows the scene automatically</td></tr>' +
    '<tr><td><b>Body</b></td><td>Markdown-formatted prose (Notes stay private — on the canvas, never shown to the reader)</td></tr>' +
    '<tr><td><b>Character</b></td><td>Who the scene belongs to — sits right under the Markdown text; if the name matches a library character, the header tints in their color and a <b>Character details</b> row shows their <code>location</code> and <code>temperature</code> (shown in Play mode and the Timeline)</td></tr>' +
    '<tr><td><b>Date / Time</b></td><td>Free-form date string — the <b>Timeline</b> view sorts scenes by it; numeric years (1800–2099) are auto-detected</td></tr>' +
    '<tr><td><b>Beat</b></td><td>Story beat on the classic dramatic arc — a dropdown of canonical beats (Opening, Inciting incident, Rising action, Midpoint, Crisis, Climax, Falling action, Resolution, Denouement, Backstory) or free text; its color tints the chip on the card foot and the beat chips in the Timeline / Arc views, with a stable generated color for custom beats</td></tr>' +
    '<tr><td><b>Entry requirement</b> ⚔</td><td>An optional condition on any scene — the reader can only <b>arrive</b> while it holds; every entrance (choices, [[links]], drawn connections, jumps) is gated at once, and the card carries a ⚔ chip. Unmet, the choice shows <b>locked</b> with its requirement instead of vanishing. Same syntax as connection conditions</td></tr></table>' +
    '<h3>Choices &amp; per-type extras</h3>' +
    '<table><tr><th>Where</th><th>What</th></tr>' +
    '<tr><td>Player · NPC · Choice · Hub · Action · Condition · Text · Exposition</td><td>A <b>choices</b> list in the inspector — right under the Markdown text, above Character; each row is a label, a target (a #tag, an id <i>or an exact title</i>), an optional ⚙ condition (the choice is offered only while it holds) and an optional 🎨 <b>tone</b> (kind, witty, bold, cold — any word) that colors the choice\'s dot in Play mode and its dashed arrow on the map. Choices drawn as dashed arrows on the map and offered in Play mode before map connections</td></tr>' +
    '<tr><td>NPC body</td><td>An optional <code>&lt;screenplay&gt;…&lt;/screenplay&gt;</code> block at the top renders as formatted screenplay (INT./EXT. slug lines)</td></tr>' +
    '<tr><td>Hub</td><td>Act labels (e.g. INCITING INCIDENT, RISING TENSION, CLIMAX) shown as styled chips when the body is empty</td></tr>' +
    '<tr><td>Action / Condition</td><td>State scripts — see the variables table below. The card carries a <b>⚙ chip</b> with the condition, so gating is visible without selecting anything (⚔ = entry requirement, ⚙ = this node&#39;s condition)</td></tr>' +
    '<tr><td>Jump</td><td>Target by tag, id — or type a scene\'s <b>exact title</b> — chapter transitions and hops to not-yet-written scenes</td></tr>' +
    '<tr><td>Connections (arrows)</td><td>Every drawn connection can carry a Markdown <b>label</b> (double-click the edge) and an optional <b>condition</b> — the reader only gets that path while it holds; variable conditions show a ⚙ badge, <code>@Character Attribute</code> skill checks a ⚔ badge, dice conditions (<code>playerStr &gt; d20</code>) a 🎲 badge, presence checks (<code>present(Kim)</code>) a 👤 badge on their chip. Tick <b>🧵 Main path</b> (connection inspector) to mark the primary route out of a fork — it draws as a <b>gold thread</b> on the map and reads <b>bold gold</b> in 📖 Reading order, so the spine of the story is visible at a glance</td></tr>' +
    '<tr><td>Connection flags</td><td>Optional per-connection play rules: <b>↻ Persist</b> keeps a choice available after the reader uses it, marked “↻ visited” (“exit to lobby” links); <b>⚡ Once</b> fires only once per playthrough, then hides the choice (one-shot secrets). Toggle them in the connection inspector; both reset on every new playthrough. <b>🧵 Main path</b> is an authoring mark, not a play rule — it never gates or hides anything, it just highlights the spine</td></tr></table>' +
    '<p class="hint">Every node shares the same fields — types only change defaults, looks and how Play mode treats them. Set a custom <b>Color</b> in the inspector to override the type default.</p>' +
    '<h3>Story variables (Action &amp; Condition)</h3>' +
    '<table><tr><th>Syntax</th><th>Result</th></tr>' +
    '<tr><td><code>gold += 10</code> / <code>gold -= 5</code></td><td>Add / subtract a number (concatenates for text)</td></tr>' +
    '<tr><td><code>has_key = true</code> · <code>set hp = 3</code></td><td>Set a variable — <code>true</code>, <code>false</code>, numbers and <code>"quoted text"</code> supported</td></tr>' +
    '<tr><td><code>has_key == true</code> · <code>gold &gt;= 10</code> · <code>!has_key</code></td><td>Condition expressions (<code>== != &gt; &lt; &gt;= &lt;=</code>, bare truthiness, <code>not</code>)</td></tr>' +
    '<tr><td><code>@Lin Waner Affection == Confidante</code></td><td><b>Tier gating</b> — when the attribute carries a ⚖ tier table (character inspector → attribute row → ⚖), a <b>label</b> on the right compares against the value&#39;s rung: <code>==</code> / <code>!=</code> match the story label, <code>&gt;=</code> / <code>&lt;=</code> / <code>&gt;</code> / <code>&lt;</code> compare rungs (<code>&gt;= Close Friend</code> = at least that close). Plain numbers keep comparing as numbers</td></tr>' +
    '<tr><td><code>present(The Doorkeeper)</code> · <code>!present(The Doorkeeper)</code></td><td><b>Character presence</b> — true while the character is on stage. Arriving at a scene with a Character (or an NPC scene) puts them on stage; <code>present(Name) = false</code> in an Action takes them off, <code>present(Name) = true</code> puts them on. Works in every gate (⚙ / ⚔ / req / {{when:}} / Jump conditions); a name matching no library character reads as unmet and the Problems panel warns</td></tr>' +
    '<tr><td>Page dressing in Play mode</td><td>Each scene opens with a screenplay-style <b>SCENE slug</b> (location + date in caps, tinted with the location color) and the speaker appears as a colored <b>name pill</b>; the exported HTML twin shows the same</td></tr>' +
    '<tr><td>State chip in Play mode</td><td>Live variables (🧩), characters on stage (👤) and the route trace (⚡ effects, ⚑ conditions, ↪ jumps) show under the page</td></tr></table>' +
    '<h3>Markdown</h3>' +
    '<table><tr><th>Syntax</th><th>Result</th></tr>' +
    '<tr><td><code># H1</code> … <code>###### H6</code></td><td>Headings</td></tr>' +
    '<tr><td><code>**bold**</code> · <code>*italic*</code> · <code>~~strike~~</code></td><td>Emphasis</td></tr>' +
    '<tr><td><code>* item</code> · <code>1. item</code></td><td>Lists</td></tr>' +
    '<tr><td><code>&gt; quote</code></td><td>Blockquote</td></tr>' +
    '<tr><td><code>\'\'\'SPEAKER: line\'\'\'</code></td><td>Quote-style dialogue — the speaker\'s name shows as a small accent above the quote, tinted with their color when it matches a library character; a line with no colon is a bare quote, and consecutive quotes group into one block</td></tr>' +
    '<tr><td><code>`code`</code> · triple backticks</td><td>Inline / fenced code</td></tr>' +
    '<tr><td><code>---</code></td><td>Horizontal rule</td></tr></table>' +
    '<h3>Links (Twine-style)</h3>' +
    '<table><tr><th>Syntax</th><th>Result</th></tr>' +
    '<tr><td><code>[[Target]]</code></td><td>Choice leading to scene <b>Target</b></td></tr>' +
    '<tr><td><code>[[Speak kindly->Target]]</code></td><td>Labelled choice to <b>Target</b></td></tr>' +
    '<tr><td><code>[[Speak kindly|Target]]</code></td><td>Same thing, pipe syntax</td></tr>' +
    '<tr><td><code>[[Target&lt;-Speak kindly]]</code></td><td>Same thing, backlink syntax — target first, label after the arrow</td></tr>' +
    '<tr><td><code>[[Speak kindly->Target {{when:has_key}}]]</code></td><td>Gated choice — offered only while the condition holds (same syntax as connection conditions, incl. ⚔ <code>@Character Attribute</code> checks); author views mark it with a dashed ⚔ chip</td></tr></table>' +
    '<p class="hint">Text links and hand-drawn map connections are both offered as choices when playing. Renaming a scene updates every <code>[[link]]</code> that points to it.</p>' +
    '<h3>Library 📚 (sidebar tab)</h3>' +
    '<p class="hint">The persistent worldbuilding database for your story — independent of any board, it travels with saves and exports.</p>' +
    '<table><tr><th>Category</th><th>What it holds</th></tr>' +
    '<tr><td><b>💬 Characters</b></td><td>Profiles for every named person — name (referenced by <code>@mention</code> in scene bodies and the NPC speaker field), color (scene-card header tint), role, portrait initials, description, goals, flaw, abilities, an attribute grid (per-character stats, readable from any condition as <code>@Name Attribute</code> — e.g. <code>@The Doorkeeper Patience &gt;= 7</code> gates a connection as a ⚔ skill check; give an attribute a <b>⚖ tier table</b> and its numbers read as story labels — <code>7 → “Warm”</code> — gateable as <code>@Name Attribute == Label</code> and sortable in the 🤝 roster), <b>traits</b> (cross-character tags — type the same trait on several characters and it becomes a clickable, filterable group in the 📇 Char view), and a Main / Secondary / Casual importance category. The <b>Encounter</b> field can <code>@mention</code> other characters, locations or items.</td></tr>' +
    '<tr><td><b>📍 Locations</b></td><td>Places in your story — name, color and free-form links to other places</td></tr>' +
    '<tr><td><b>🎒 Items</b></td><td>Objects the player can pick up — the <b>present</b> flag (default on) controls whether <code>{{when:Item name}}</code> blocks see the item; untick it to remove it from the starting inventory</td></tr>' +
    '<tr><td><b>🔢 Variables</b></td><td>Numeric or string values that drive conditionals — seeded into every playthrough, referenced in connection conditions and <code>{{when:}}</code> blocks</td></tr>' +
    '<tr><td><b>🌍 Worldbuilding</b></td><td>Free-form named entries (history, geography, culture, magic system…) — each holds renameable, reorderable <code>{name, value}</code> field pairs</td></tr>' +
    '<tr><td><b>🎙 Narrative Voices</b></td><td>The "who is telling" — narrators, chroniclers, in-world documents. Pick one in an Exposition scene (Narrative voice field); its color tints the card header and labels the scene in Play mode</td></tr></table>' +
    '<p class="hint">Select any library entry to edit it in the inspector — or right-click it for <b>Rename (F2)</b>, <b>⧉ Duplicate</b> and <b>✕ Delete</b>; right-click a section header to add a new entry of that kind. The <b>💬 Character sheets</b> view (key <code>C</code>) prints every character profile as a card — handy for TTRPG session handouts.</p>' +
    '<h3>Mentions &amp; conditional prose</h3>' +
    '<table><tr><th>Syntax</th><th>Result</th></tr>' +
    '<tr><td><code>@The Doorkeeper</code></td><td>A mention chip for any library character, location or item — tinted in its color in Play mode; author views show it on the canvas too</td></tr>' +
    '<tr><td><code>{{when:has_key == true}}…{{/when}}</code></td><td>Inline conditional block — the scene shows this text only while the condition holds (same syntax as Condition nodes; item names test inventory presence)</td></tr>' +
    '<tr><td><code>{{said:tag}}</code> / <code>{{said:tag|fallback}}</code></td><td>Inventory echo — prints the label of the choice the reader took to reach that scene, looked up by its tag, id or title; until it is taken, the optional <code>|fallback</code> text shows instead. Author views mark the token with a dashed outline</td></tr></table>' +
    '<h3>Views — toolbar ▦ ⏱ ⊞ ◫ ▤ ▥ 📜 📖 📇 📊</h3>' +
    '<p class="hint">Ten switchable views of the same story. The Graph is the free-form canvas; the rest are generated from scene fields (Date, Tag, Beat, Act, POV, Tension, Status, Chapter) that you edit in the Sheet — every change applies everywhere.</p>' +
    '<table><tr><th>View</th><th>What it shows</th></tr>' +
    '<tr><td><b>▦ Graph</b> <code>(G)</code></td><td>The free-form canvas — the default. Arcs with 2+ scenes get a tinted <b>frame</b> (title bar, scene count, collapse button): drag the frame to move its scenes as a group, － tucks them into a pill, ＋ brings them back, and the <b>⌒ Frames</b> toolbar button hides all frames. Clicking a collapsed arc&#39;s scene anywhere (sidebar, Char view…) re-expands it automatically.</td></tr>' +
    '<tr><td><b>⏱ Timeline</b> <code>(T)</code></td><td>Chronology rows auto-arranged into eras by year (1800–2099 detected from scene dates); <b>↑ / ↓</b> buttons reorder scenes within the same year</td></tr>' +
    '<tr><td><b>⊞ Sheet</b> <code>(S)</code></td><td>Every field of every scene in one spreadsheet — click any cell to edit it for all views; <b>⇩ CSV</b> / <b>⇩ JSON</b> in the bar export the rows as a spreadsheet or data file</td></tr>' +
    '<tr><td><b>◫ Outline</b> <code>(O)</code></td><td>Radial mind-map of the library — characters in the inner ring, locations / items / variables in the outer ring; drag cards, positions persist across reloads</td></tr>' +
    '<tr><td><b>▤ Arc</b> <code>(A)</code></td><td>Chapters × scenes on a beat-colored horizontal strip with detail cards stacked above</td></tr>' +
    '<tr><td><b>▥ Beat</b> <code>(B)</code></td><td>Per-scene table: # / Title / Beat / Act / POV / Date / Tension (0–10 bar) / Words / Status</td></tr>' +
    '<tr><td><b>📜 Script</b> <code>(R)</code></td><td>A linear, read-only read of the whole story in timeline order — body text, spoken lines, choice lists and <code>Go to:</code> jumps in one scroll. Click any scene card to open it on the map</td></tr>' +
    '<tr><td><b>📖 Reading order</b> <code>(E)</code></td><td>Numbered play pages from the start scene through every exit — gamebook style; each page shows which page its exits lead to. <b>▶ Run</b> plays from the start; <b>⇅ Re-sort</b> restamps the timeline with this order; unreached scenes are listed at the bottom</td></tr>' +
    '<tr><td><b>📇 Char</b> <code>(C)</code></td><td>Printable character profile cards, two per row — tabletop session handouts. The <b>🤝 Relationships</b> tab switches to a sortable cast roster: every ⚖ tiered attribute becomes a column showing the value and the story label it reads as (e.g. <b>62</b> · <i>Close Friend</i>) — click a header to sort (blanks sink), a row to edit the character</td></tr>' +
    '<tr><td><b>📊 Stats</b> <code>(P)</code></td><td>Summary cards plus a cumulative words-over-time line chart and a words-per-scene bar chart</td></tr></table>' +
    '<h3>Shortcuts</h3>' +
    '<table><tr><th>Key</th><th>Action</th></tr>' +
    '<tr><td><code>N</code></td><td>New node</td></tr>' +
    '<tr><td><code>F</code></td><td>Fit map to view</td></tr>' +
    '<tr><td><code>+</code> / <code>−</code></td><td>Zoom in / out</td></tr>' +
    '<tr><td><code>G</code></td><td>Jump to the Graph view</td></tr>' +
    '<tr><td><code>T</code> / <code>S</code> / <code>O</code></td><td>Jump to Timeline / Sheet / Outline view</td></tr>' +
    '<tr><td><code>A</code> / <code>B</code> / <code>C</code> / <code>P</code></td><td>Jump to Arc / Beat / Char / Stats view</td></tr>' +
    '<tr><td><code>Ctrl+S</code></td><td>Save the project to disk — into the opened file, or via a Save-as dialog where you can rename it (Chromium); falls back to a Project .json download elsewhere</td></tr>' +
    '<tr><td><code>Ctrl+O</code></td><td>Open a project file from disk (Chromium); elsewhere opens the classic import picker</td></tr>' +
    '<tr><td><code>Del</code></td><td>Delete the selection — a node or library entry needs a second press to confirm; a multi-selection goes in one confirmed step</td></tr>' +
    '<tr><td><code>F2</code></td><td>Rename the selected library entry — focuses its name field</td></tr>' +
    '<tr><td><code>Arrows</code></td><td>Nudge the selected scene(s) — <code>Shift</code> = 10px</td></tr>' +
    '<tr><td><code>Ctrl/Shift+click</code> · <code>Shift+drag</code></td><td>Multi-select nodes / rubber-band a selection (<code>Ctrl+drag</code> extends it)</td></tr>' +
    '<tr><td><code>Ctrl+P</code></td><td>Play from start</td></tr>' +
    '<tr><td><code>Ctrl+F</code></td><td>Find scenes — live search across title, body, tag, beat, POV and character; matches stay bright while the rest dims, Enter / Shift+Enter cycles through them</td></tr>' +
    '<tr><td><code>Ctrl+Z</code> / <code>Ctrl+Shift+Z</code></td><td>Undo / redo the last change (60 steps)</td></tr>' +
    '<tr><td><code>Esc</code></td><td>Close player / modal / cancel link draft / return to the Graph from any view</td></tr></table>' +
    '<p class="hint">Your story autosaves to this browser after every change — the <b>✓ autosave</b> chip in the status bar confirms the last save succeeded (it warns if storage is full or blocked, and pauses with <b>⏸</b> while another tab owns the session). Saves are versioned and a ring of five safety backups rotates automatically; if the primary save is ever unreadable, your story is recovered from the newest backup. Layout, zoom and the snap toggle are restored on reload. Use <b>📂 Open</b> / <b>💾 Save</b> / <b>💾⭳ Save as…</b> (or <code>Ctrl+O</code> / <code>Ctrl+S</code>) to work with a project file anywhere on disk — Save-as lets you pick the folder and rename the file before it lands; the app remembers the opened file across sessions in Chromium browsers, and everywhere else falls back to downloads and imports. Stories also round-trip through <b>Twee</b> (Twine / Tweego format) — drawn connections with their conditions and the whole library (character attribute grids &amp; traits, locations, items, variables, voices) survive the trip; the first Twee export mints the story a permanent <b>IFID</b> (the Twine world&#39;s story fingerprint, a v4 UUID per the Twee 3 spec) and every later export carries it — and the theme toggle switches between dark and light. The ⇩ Export menu can also save the map itself as a <b>.png</b> image or a <b>.svg</b> vector — a snapshot of the canvas with cards, edges and labels, handy for pitches and wikis.</p>');
};

/* ---------------- context menu ---------------- */
var ctx = { id: null, lib: null, wx: 0, wy: 0 };
function ctxBtn(action, label, danger){
  return '<button data-act="' + action + '"' + (danger ? ' class="danger"' : '') + '>' + label + '</button>';
}
function showCtxMenu(clientX, clientY, nodeId){
  ctx.id = nodeId;
  var p = toWorld(clientX, clientY);
  ctx.wx = p.x; ctx.wy = p.y;
  var html = '';
  if (nodeId){
    html += ctxBtn('edit', '✎ Edit text');
    html += ctxBtn('start', '▶ Set as start node');
    html += ctxBtn('dup', '⧉ Duplicate');
    html += ctxBtn('connect', '↗ Add connected scene');
    html += ctxBtn('playhere', '▶ Play from here');
    html += '<div class="ctx-sep"></div>';
    html += ctxBtn('del', '✕ Delete node', true);
  } else {
    html += ctxBtn('add', '＋ Add scene here');
    html += ctxBtn('note', '✎ Add note here');
    html += '<div class="ctx-sep"></div>';
    html += ctxBtn('tidy', '✧ Tidy layout');
    html += ctxBtn('check', '✓ Check story');
    html += ctxBtn('play', '▶ Play story');
  }
  var el = $('ctxmenu');
  el.innerHTML = html;
  el.hidden = false;
  el.style.left = Math.min(clientX, window.innerWidth - el.offsetWidth - 8) + 'px';
  el.style.top = Math.min(clientY, window.innerHeight - el.offsetHeight - 8) + 'px';
}
function hideCtxMenu(){
  $('ctxmenu').hidden = true;
  ctx.id = null;
  ctx.lib = null;
}
/* right-click menu for library entries — Rename / Duplicate / Delete; on a section header: Add */
function showLibCtxMenu(clientX, clientY, kind, id){
  ctx.id = null;
  ctx.lib = { kind: kind, id: id };
  var K = LIB_KINDS[kind];
  var html = '';
  if (id && libEntity(kind, id)){
    html += ctxBtn('librename', '✎ Rename <small>(F2)</small>');
    html += ctxBtn('libdup', '⧉ Duplicate');
    html += '<div class="ctx-sep"></div>';
    html += ctxBtn('libdel', '✕ Delete', true);
  } else if (K){
    html += ctxBtn('libadd', '＋ Add ' + K.label.replace(/s$/, '').toLowerCase());
  }
  var el = $('ctxmenu');
  el.innerHTML = html;
  el.hidden = false;
  el.style.left = Math.min(clientX, window.innerWidth - el.offsetWidth - 8) + 'px';
  el.style.top = Math.min(clientY, window.innerHeight - el.offsetHeight - 8) + 'px';
}
/* duplicate a library entry — deep copy, fresh id, " (copy)" name; select the copy */
function duplicateLibEntity(kind, id){
  var e = libEntity(kind, id);
  if (!e) return null;
  var copy = JSON.parse(JSON.stringify(e));
  copy.id = uid();
  if (copy.name) copy.name = String(copy.name) + ' (copy)';
  libArr(kind).push(copy);
  save();

  }
  if (n.img) html = '<div class="play-cover" style="background-image:url(&quot;' + esc(n.img) + '&quot;)"></div>' + html;

  var chLine = null;
  if (n.type === 'npc' && n.speaker) chLine = characterById(n.speaker);

  else if (n.character) chLine = characterByName(n.character);
  var chShow = null;
  if (n.type === 'npc' && n.speaker) chShow = chLine ? chLine.name : null;
  else if (n.type === 'exposition' && n.voice) chShow = chLine ? chLine.name : null;
  else if (n.character) chShow = n.character;
  if (chShow){
    html += '<div class="play-speaker"' + (chLine && chLine.color ? ' style="color:' + esc(chLine.color) + ';background:' + hexAlpha(chLine.color, .14) + ';border-color:' + hexAlpha(chLine.color, .45) + '"' : '') + '>' + esc(chShow) + '</div>';
    if (chLine && (chLine.location || chLine.temperature)){

  if (ch.length){
    html += '<div class="play-choices">' + ch.map(function(c, i){
      return '<button class="play-choice' + (c.visited ? ' visited' : '') + (c.locked ? ' locked' : '') + '" data-go="' + c.id + '"' + (c.ok && !c.locked ? '' : ' disabled="disabled"') + '>' +
        (c.tone ? '<i class="pc-tone" style="background:' + esc(toneColor(c.tone)) + '" title="tone: ' + esc(c.tone) + '"></i>' : '') +
        '<span class="bullet">' + (i + 1) + '.</span>' + esc(c.label) +
        (c.locked ? '<span class="pc-req" title="Entry requirement — the choice opens once it holds">⚔ ' + esc(c.req) + '</span>' : '') +
        (c.visited ? '<span class="pc-vis">↻ visited</span>' : '') + '</button>';
    }).join('') + '</div>';
  } else if (n.type === 'ending'){
    html += '<div class="play-end">— The End —</div>';
  } else {
    html += '<div class="play-note">✎ The trail stops here — this scene has no exits.</div>';
  }
  if (n.type === 'note') html += '<div class="play-note">✎ (author note)</div>';
  if (playTrace.length){
    html += '<div class="play-route">' + playTrace.map(function(t){ return '<div>' + esc(t) + '</div>'; }).join('') + '</div>';
    playTrace = [];
  }

  var pres = Object.keys(playState).filter(function(k){ return k.indexOf('present:') === 0; })
    .map(function(k){ var cp = characterById(k.slice(8)); return cp ? cp.name : k.slice(8); });
  if (keys.length || pres.length){
    html += '<div class="play-state">' + keys.map(function(k){ return '<span>' + esc(k) + ' = ' + esc(String(playState[k])) + '</span>'; }).join('') +
      (pres.length ? '<span title="Characters on stage — marked present by their scenes, testable with present(Name)">👤 ' + esc(pres.join(', ')) + '</span>' : '') + '</div>';
  }
  page.innerHTML = html;
  $('playWhere').textContent = n.title + ' · ' + playStack.length + ' step' + (playStack.length > 1 ? 's' : '');
  page.querySelectorAll('.play-choice[data-go]').forEach(function(b){
    b.onclick = function(){
      if (b.getAttribute('disabled') !== 'disabled'){
        var src = playStack[playStack.length - 1];

/* ---------------- import / export ---------------- */
function download(name, content, type){
  try {
    var blob = new Blob([content], { type: type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 500);
    toast('Exported <b>' + name + '</b>.');
  } catch (e) { toast('Export failed in this preview sandbox — download the app file and run it in a browser.'); }
}
function safeName(){ return (story.meta.title || 'story').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'story'; }
function exportProject(){
  download(safeName() + '.loomlight.json', JSON.stringify({ loomlight: 1, story: story }, null, 2), 'application/json');
}
/* ---------------- File System Access: real Open / Save / Save-as on disk ----------------
   Progressive enhancement — in Chromium, showOpenFilePicker / showSaveFilePicker grant a
   FileSystemFileHandle the app keeps (IndexedDB) so Save writes straight back into the
   same file. Everywhere else the classic download / file-input path stays in effect. */
var fsaSupported = !!(window.showOpenFilePicker && window.showSaveFilePicker);
var projHandle = null;              /* FileSystemFileHandle of the opened project file */
var projName = '';                 /* its file name, shown in the title bar */
var PROJ_STORE = 'loomlight-project'; /* IndexedDB store name for the handle */
function fsaDb(){
  return new Promise(function(res, rej){
    var rq = indexedDB.open('loomlight', 1);
    rq.onupgradeneeded = function(){ rq.result.createObjectStore(PROJ_STORE); };
    rq.onsuccess = function(){ res(rq.result); };
    rq.onerror = function(){ rej(rq.error); };
  });
}
function idbSet(key, val){
  return fsaDb().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction(PROJ_STORE, 'readwrite');
      tx.objectStore(PROJ_STORE).put(val, key);
      tx.oncomplete = function(){ res(); };
      tx.onerror = function(){ rej(tx.error); };
    });
  });
}
function idbGet(key){
  return fsaDb().then(function(db){
    return new Promise(function(res, rej){
      var tx = db.transaction(PROJ_STORE, 'readonly');
      var rq = tx.objectStore(PROJ_STORE).get(key);
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ rej(rq.error); };
    });
  });
}
function projJson(){ return JSON.stringify({ loomlight: 1, story: story }, null, 2); }
function fsaTypes(){ return [{ description: 'Loomlight project', accept: { 'application/json': ['.loomlight.json', '.json'] } }]; }
/* write through the stored handle; re-verify permission first */
function fsaWrite(handle, text){
  return handle.queryPermission({ mode: 'readwrite' }).then(function(p){
    if (p === 'granted') return;
    return handle.requestPermission({ mode: 'readwrite' });
  }).then(function(){
    return handle.createWritable();
  }).then(function(w){
    return w.write(new Blob([text], { type: 'application/json' })).then(function(){ return w.close(); });
  });
}
function projectSaved(name){
  projName = name;
  if (document && document.title !== undefined) document.title = name + ' — Loomlight';
  toast('💾 Saved to <b>' + esc(name) + '</b> on disk.');
}
/* Save: through the handle when we have one; otherwise Save-as. FSA-missing → download fallback. */
function saveProject(){
  if (!fsaSupported){ exportProject(); return; }
  if (projHandle){
    fsaWrite(projHandle, projJson()).then(function(){ projectSaved(projName); })
      .catch(function(){ toast('⚠ Disk save was refused — falling back to a download.'); exportProject(); });
    return;
  }
  saveProjectAs();
}
/* Save as: OS dialog with an editable, pre-filled name — rename before saving. */
function saveProjectAs(){
  if (!fsaSupported){ exportProject(); return; }
  window.showSaveFilePicker({ suggestedName: safeName() + '.loomlight.json', types: fsaTypes() })
    .then(function(handle){
      projHandle = handle;
      return fsaWrite(handle, projJson()).then(function(){ return idbSet('handle', handle); })
        .then(function(){ projectSaved(handle.name); });
    })
    .catch(function(){ /* user cancelled the dialog — not an error */ });
}
/* Open: pick a project from disk, parse it, take over the working story. */
function openProject(){
  if (!fsaSupported){ $('importFile').click(); return; }
  saveNow();   /* persist any pending debounced autosave before replacing the story */
  window.showOpenFilePicker({ types: fsaTypes(), multiple: false })
    .then(function(handles){
      var handle = handles && handles[0];
      if (!handle) return;
      return handle.getFile().then(function(file){
        return file.text();
      }).then(function(raw){
        var d = JSON.parse(String(raw).trim());
        var s = d.story && d.story.nodes ? d.story : (d.nodes ? d : null);
        if (!s || !Array.isArray(s.nodes) || !s.nodes.length) throw new Error('bad');
        importStory(s);   /* shared import path — normalizes, pushes undo, renders */
        projHandle = handle;
        projName = handle.name;
        document.title = handle.name + ' — Loomlight';
        return idbSet('handle', handle);
      }).catch(function(err){
        if (err && err.name === 'AbortError') return; /* cancelled */
        toast('⚠ Could not read that file — is it a Loomlight project (.json)?');
      });
    })
    .catch(function(){ /* picker unavailable or dismissed */ });
}
/* on load: restore the remembered project handle if the browser still grants access */
function restoreProjectHandle(){
  if (!fsaSupported) return Promise.resolve(false);
  return idbGet('handle').then(function(h){
    if (!h) return false;
    return h.queryPermission({ mode: 'readwrite' }).then(function(p){
      if (p !== 'granted') return false;
      projHandle = h;
      projName = h.name || '';
      if (projName && document && document.title !== undefined) document.title = projName + ' — Loomlight';
      return true;
    }).catch(function(){ return false; });
  }).catch(function(){ return false; });
}
/* ---------------- map image export (.png / .svg) ----------------

   bezier edges the app draws — then either saves it as a .svg or rasterizes it
   on a canvas for a .png (capped at 4096 px a side, like a big print sheet). */
var TYPE_SVG_TINT = {
  narrative:'#4f8cc9', player:'#1d4ed8', npc:'#b91c1c', choice:'#0e7490',
  hub:'#64748b', action:'#c2410c', condition:'#7c3aed', jump:'#0891b2',
  ending:'#a33541', note:'#a16207', text:'#166534', exposition:'#15803d'
};
function mapExportBBox(){
  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  story.nodes.forEach(function(n){
    var w = nodeW(n), h = nodeH(n, nodeEls[n.id]);
    if (n.x < minX) minX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.x + w > maxX) maxX = n.x + w;
    if (n.y + h > maxY) maxY = n.y + h;
  });
  if (minX > maxX){ minX = 0; minY = 0; maxX = 800; maxY = 600; }
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };

/* plain-text preview lines for a card body, wrapped to ~34 chars, max 3 lines */
function svgPreviewLines(n){
  var t = String(n.text || '').replace(/\s+/g, ' ').trim();
  if (!t) return [];
  var words = t.split(' '), lines = [], cur = '';
  for (var i = 0; i < words.length && lines.length < 3; i++){
    if (cur && (cur + ' ' + words[i]).length > 34){ lines.push(cur); cur = words[i]; }
    else cur = cur ? cur + ' ' + words[i] : words[i];
  }
  if (cur && lines.length < 3) lines.push(cur);
  else if (cur) lines[2] = lines[2].slice(0, 31) + '…';
  return lines;
}
function mapSvgMarkup(){

  var W = Math.round(bb.w + pad * 2), H = Math.round(bb.h + pad * 2);
  var s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '"' +
    ' viewBox="' + (bb.x - pad) + ' ' + (bb.y - pad) + ' ' + W + ' ' + H + '"' +
    ' font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">' +
    '<defs><marker id="mapArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">' +
    '<path d="M0,0 L10,5 L0,10 z" fill="#5b6478"></path></marker></defs>' +
    '<rect x="' + (bb.x - pad) + '" y="' + (bb.y - pad) + '" width="' + W + '" height="' + H + '" fill="#0e1014"></rect>';
  /* edges first so cards sit on top — same link set + non-duplicate choices as the map */
  var draw = story.links.slice();
  var seen = {};   /* from→to pairs already drawn — O(1) duplicate checks instead of .some() scans */
  story.links.forEach(function(li){ seen[li.from + '→' + li.to] = true; });
  story.nodes.forEach(function(n){
    (Array.isArray(n.choices) ? n.choices : []).forEach(function(c, i){
      if (!c || !c.target) return;
      var t = resolveNodeRef(c.target);
      if (!t || t.id === n.id) return;
      var k = n.id + '→' + t.id;
      if (seen[k]) return;
      seen[k] = true;
      draw.push({ id: 'ch:' + n.id + ':' + i, from: n.id, to: t.id, label: c.label, tone: c.tone || '', cond: c.cond || '', choice: true });
    });
  });
  draw.forEach(function(l){
    var g = edgeGeom(l);
    if (!g) return;
    s += '<path d="' + g.d + '" fill="none" stroke="#5b6478" stroke-width="1.6"' +
         (l.choice ? ' stroke-dasharray="5 4"' : '') + ' marker-end="url(#mapArrow)"></path>';
    if (l.label){
      var lb = esc(String(l.label).replace(/\|.*$/, ''));
      s += '<text x="' + g.mx + '" y="' + (g.my - 5) + '" fill="#9aa3b8" font-size="9.5" text-anchor="middle">' + lb + '</text>';
    }
  });
  story.nodes.forEach(function(n){
    var w = nodeW(n), h = nodeH(n, nodeEls[n.id]);
    var tint = TYPE_SVG_TINT[n.type] || '#4f8cc9';
    s += '<rect x="' + n.x + '" y="' + n.y + '" width="' + w + '" height="' + h + '" rx="10" fill="#1b1f29" stroke="#3a4154" stroke-width="1"></rect>';
    s += '<rect x="' + n.x + '" y="' + n.y + '" width="' + w + '" height="26" rx="10" fill="' + tint + '" opacity=".18"></rect>';
    s += '<circle cx="' + (n.x + 14) + '" cy="' + (n.y + 13) + '" r="4" fill="' + tint + '"></circle>';
    var title = esc(String(n.title || 'Untitled').slice(0, 30));
    s += '<text x="' + (n.x + 26) + '" y="' + (n.y + 17) + '" fill="#d8dce6" font-size="12.5" font-weight="600">' + title + '</text>';
    if (n.id === story.meta.start)
      s += '<text x="' + (n.x + w - 14) + '" y="' + (n.y + 17) + '" fill="#7c6cf0" font-size="12" text-anchor="end">★ start</text>';
    svgPreviewLines(n).forEach(function(line, li){
      s += '<text x="' + (n.x + 12) + '" y="' + (n.y + 44 + li * 15) + '" fill="#8b93a7" font-size="10.5">' + esc(line) + '</text>';
    });
  });
  s += '<text x="' + (bb.x - pad + 10) + '" y="' + (bb.y - pad + H - 12) + '" fill="#5d6478" font-size="10">' +

function exportMapSvg(){
  if (!story.nodes.length){ toast('Nothing to export — the map is empty.'); return; }
  download(safeName() + '-map.svg', mapSvgMarkup(), 'image/svg+xml');
}
function exportMapPng(){
  if (!story.nodes.length){ toast('Nothing to export — the map is empty.'); return; }
  var bb = mapExportBBox(), pad = 60;
  var W = Math.round(bb.w + pad * 2), H = Math.round(bb.h + pad * 2);
  var scale = Math.max(1, Math.min(2, 4096 / Math.max(W, H)));   /* crisp 2× for small maps, capped at 4096 px */
  var img = new Image();
  img.onload = function(){
    try {

}
