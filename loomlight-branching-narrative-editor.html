<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1.0" />
<title>Loomlight — Branching Narrative Editor</title>

     (no /favicon.ico request when served, a proper tab icon when opened from disk). -->

/* =====================================================================
   LOOMLIGHT — STYLESHEET (styles.css module)
   One <style> block so the page stays self-contained (the canvas preview
   and the exported HTML load it with zero network requests). Sections, in
   file order — the same discipline as a split styles.css:
     1. design tokens (:root, light theme)
     2. top bar & toolbar
     3. app layout (canvas, sidebars, statusbar)
     4. arc frames & map nodes
     5. live Problems panel
     6. inspector (incl. choicerow, character fields)
     7. player · find bar · outline
     8. modal / toast / context menu
     9. common field chips (tags, characters, dates)
    10. library sidebar & character sheets
    11. view chrome: timeline · sheet · radial · arc · beat · stats · script
   ===================================================================== */
:root{
  --bg:#0e1014;
  --panel:#15181f;
  --panel2:#1b1f29;
  --panel3:#232836;
  --line:#2b3140;
  --line2:#3a4154;
  --text:#d8dce6;
  --dim:#8b93a7;
  --faint:#5d6478;
  --accent:#7c6cf0;
  --accent-soft:rgba(124,108,240,.16);
  --teal:#39c4a8;
  --rose:#e06a75;
  --amber:#e8b34b;
  --blue:#4f8cc9;
  --gray:#7a8296;
  --dot:#242a37;
  --radius:10px;
  --font:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
:root[data-theme="light"]{
  --bg:#e8ecf2;--dot:#c3cad8;--panel:#f4f6fa;--panel2:#ffffff;--panel3:#e9edf5;
  --line:#d5dae6;--line2:#b9c2d4;--text:#1c2333;--dim:#5b6478;--faint:#8a92a8;
  --accent:#5b62d6;--accent-soft:rgba(91,98,214,.13);
}
:root[data-theme="light"] .t-narrative .node-badge{background:rgba(44,95,150,.14);color:#2c5f96}
:root[data-theme="light"] .t-player .node-badge{background:rgba(29,78,216,.12);color:#1d4ed8}
:root[data-theme="light"] .t-npc .node-badge{background:rgba(185,28,28,.12);color:#b91c1c}
:root[data-theme="light"] .t-choice .node-badge{background:rgba(14,116,144,.12);color:#0e7490}
:root[data-theme="light"] .t-hub .node-badge{background:rgba(71,85,105,.14);color:#475569}
:root[data-theme="light"] .t-action .node-badge{background:rgba(194,65,12,.12);color:#c2410c}
:root[data-theme="light"] .t-condition .node-badge{background:rgba(124,58,237,.12);color:#7c3aed}
:root[data-theme="light"] .t-jump .node-badge{background:rgba(8,145,178,.12);color:#0891b2}
:root[data-theme="light"] .t-ending .node-badge{background:rgba(163,53,65,.14);color:#a33541}
:root[data-theme="light"] .t-note .node-badge{background:rgba(202,138,4,.14);color:#a16207}
:root[data-theme="light"] .t-text .node-badge{background:rgba(22,101,52,.12);color:#166534}
:root[data-theme="light"] .t-exposition .node-badge{background:rgba(21,128,61,.12);color:#15803d}
/* sticky-note paper reads as real paper on the light theme */
:root[data-theme="light"] .t-note{background:linear-gradient(180deg,#fdf0b8,#f7e08a 62%,#f0d373);border-color:rgba(161,98,7,.4)}
:root[data-theme="light"] .t-note .node-body{color:#6b5210}
:root[data-theme="light"] .t-note .node-head{border-bottom-color:rgba(161,98,7,.22)}
:root[data-theme="light"] .tlink-chip{color:#4a3fb5;border-color:rgba(74,63,181,.35)}
:root[data-theme="light"] .tlink-chip.missing{color:#a33541;border-color:rgba(163,53,65,.45)}
:root[data-theme="light"] .tlink-chip i{opacity:.55}
:root[data-theme="light"] .node.start::after{color:#fff}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
button{font-family:var(--font)}
input,select,textarea{font-family:inherit;color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Top bar ---------- */
#topbar{
  display:flex;align-items:center;gap:10px;
  height:50px;padding:0 14px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  flex:none;position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:9px;padding-right:8px}
.brand .logo{width:22px;height:22px;flex:none}
.brand .name{font-weight:700;letter-spacing:.3px;font-size:15px}
#storyTitle{
  background:var(--panel2);border:1px solid transparent;border-radius:7px;
  padding:6px 10px;font-size:13.5px;font-weight:600;min-width:200px;max-width:340px;
}
#storyTitle:focus{outline:none;border-color:var(--accent)}
.spacer{flex:1}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--line);
  color:var(--text);border-radius:8px;
  padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;
  white-space:nowrap;
}
.tbtn:hover{background:var(--panel3);border-color:var(--line2)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn.primary:hover{filter:brightness(1.1)}
.tbtn .k{color:var(--faint);font-weight:400;font-size:11px}
.zoomgroup{display:flex;align-items:center;gap:4px}
.zoomgroup .tbtn{padding:6px 9px}
#zoomLabel{min-width:44px;text-align:center;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
details.menu{position:relative}
details.menu > summary{
  list-style:none;cursor:pointer;display:inline-flex;
}
details.menu > summary::-webkit-details-marker{display:none}
details.menu > summary .tbtn::after{content:" ▾";color:var(--faint)}
details.menu[open] .tbtn{background:var(--panel3)}
details.menu .menu-items{
  position:absolute;right:0;top:calc(100% + 6px);
  background:var(--panel2);border:1px solid var(--line2);border-radius:10px;
  min-width:230px;padding:5px;z-index:60;box-shadow:0 12px 34px rgba(0,0,0,.5);
}
details.menu .menu-items button{
  display:flex;align-items:center;gap:8px;width:100%;
  background:none;border:none;color:var(--text);
  padding:8px 10px;border-radius:7px;font-size:13px;cursor:pointer;text-align:left;
}
details.menu .menu-items button:hover{background:var(--accent-soft)}
details.menu .menu-items button small{margin-left:auto;color:var(--faint)}

/* ---------- Layout ---------- */
#main{display:flex;height:calc(100% - 50px);position:relative}
#sidebar{
  width:230px;flex:none;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;
}
#passage-list{flex:1;overflow-y:auto;padding:0 8px 12px}
.passage-item{
  display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;
  font-size:12px;color:var(--dim);cursor:pointer;border:1px solid transparent;margin-bottom:1px;
}
.passage-item:hover{background:var(--panel2);color:var(--text)}
.passage-item.active{background:var(--accent-soft);border-color:rgba(124,108,240,.35);color:#cfc8ff}
.pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbadge{font-size:8.5px;font-weight:800;letter-spacing:.5px;background:rgba(57,196,168,.15);color:var(--teal);padding:1px 5px;border-radius:4px;flex:none}
.pdot{width:8px;height:8px;border-radius:50%;flex:none}
.pdot.t-narrative{background:var(--blue)}
.pdot.t-player{background:#1d4ed8}
.pdot.t-npc{background:#b91c1c}
.pdot.t-choice{background:#0e7490}
.pdot.t-hub{background:#475569}
.pdot.t-action{background:#c2410c}
.pdot.t-condition{background:#7c3aed}
.pdot.t-jump{background:#0891b2}
.pdot.t-ending{background:var(--rose)}
.pdot.t-note{background:#ca8a04}
.pdot.t-text{background:#166534}
.pdot.t-exposition{background:#15803d}
.pempty{padding:16px 8px;text-align:center;font-size:11.5px;color:var(--faint);line-height:1.6}
/* empty-canvas onboarding hint — shows only while the board is blank */
#emptyHint:not([hidden]){
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--faint);pointer-events:none;text-align:center;z-index:1;
}
#emptyHint .eh-icon{font-size:30px;opacity:.7}
#emptyHint p{font-size:13px;font-style:italic;line-height:1.7;max-width:340px}
#emptyHint kbd{
  font-family:var(--mono);font-size:11px;font-style:normal;color:var(--dim);
  background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:5px;padding:1px 7px;white-space:nowrap;
}
#viewport{
  flex:1;position:relative;overflow:hidden;
  background:var(--bg);
  background-image:radial-gradient(circle,var(--dot) 1px,transparent 1px);
  cursor:grab;touch-action:none;
}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges .hit{pointer-events:stroke;cursor:pointer}
/* connection label chips (HTML layer, mid-arc on the curve) */
#edgechips{position:absolute;left:0;top:0;width:0;height:0;overflow:visible;pointer-events:none}
/* ---------- arc frames ---------- */
#framesLayer{position:absolute;left:0;top:0;width:0;height:0}
.frame{position:absolute;border:1.5px solid;border-radius:12px;pointer-events:auto}
.frame-head{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;font-size:12px;font-weight:600;user-select:none;cursor:grab;border-radius:10px 10px 0 0}
.frame-head:active{cursor:grabbing}
.frame-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame-count{font-weight:400;opacity:.75;font-size:11px;flex:none}
.frame-col{flex:none;margin-left:auto;width:20px;height:20px;line-height:1;border-radius:6px;border:1px solid rgba(128,128,128,.45);background:transparent;color:inherit;cursor:pointer;font-size:12px;padding:0}
.frame-col:hover{background:rgba(128,128,128,.2)}
.frame.collapsed{display:flex;align-items:center}
.frame.collapsed .frame-head{height:32px;border-radius:999px}
.edge-label{
  position:absolute;transform:translate(-50%,-50%);
  display:inline-flex;align-items:center;gap:6px;
  max-width:260px;cursor:pointer;pointer-events:auto;white-space:nowrap;
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:2px 9px;font-family:var(--font);font-size:11px;color:var(--text);
  box-shadow:0 1px 8px rgba(0,0,0,.4);
}
.edge-label:hover{border-color:var(--accent)}
.edge-label.selected{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 2px rgba(124,108,240,.28)}
.edge-label .eflag{color:var(--accent);font-weight:800;margin-left:5px}
.edge-label .elabel{overflow:hidden;text-overflow:ellipsis;max-width:210px}
.edge-label .elabel code{font-family:monospace;font-size:10px;background:var(--panel3);border-radius:3px;padding:0 3px}
.edge-label .elabel del{color:var(--dim)}
.edge-label .econd{
  display:inline-flex;align-items:center;font-family:monospace;font-size:10px;color:#b7adfb;
  background:var(--accent-soft);border:1px solid rgba(124,108,240,.4);border-radius:4px;padding:0 4px;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;
}
.edge-label .econd::before{content:'⚙';margin-right:3px}
/* ⚔ attribute/skill check badge — same chip shape, check-tinted */
.edge-label .econd.att{color:#f0c98a;background:rgba(226,149,60,.14);border-color:rgba(226,149,60,.45)}
.edge-label .econd.att::before{content:'⚔'}
[data-theme="light"] .edge-label .econd.att{color:#8a5a12;background:rgba(226,149,60,.12)}
/* 🎲 dice-roll badge — same chip shape, roll-tinted */
.edge-label .econd.dice{color:#8fd3f0;background:rgba(56,160,210,.14);border-color:rgba(56,160,210,.45)}
.edge-label .econd.dice::before{content:'🎲'}
[data-theme="light"] .edge-label .econd.dice{color:#0c5a80;background:rgba(56,160,210,.12)}
/* 👤 presence-check badge — same chip shape, presence-tinted */
.edge-label .econd.pres{color:#9fe8c8;background:rgba(45,178,122,.14);border-color:rgba(45,178,122,.45)}
.edge-label .econd.pres::before{content:'👤'}
[data-theme="light"] .edge-label .econd.pres{color:#0c6a45;background:rgba(45,178,122,.12)}
/* 🎨 tone dot — a choice's personality, colored by its tone */
.edge-label .tone-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.edge-label.ch{border-style:dashed;color:var(--dim)}
/* inline double-click label editor */
.edge-edit{
  position:absolute;z-index:40;width:210px;height:28px;padding:0 9px;
  background:var(--panel);border:1px solid var(--accent);border-radius:8px;outline:none;
  color:var(--text);font-family:var(--font);font-size:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.55);
}

/* ---------- Nodes ---------- */
.node{
  position:absolute;width:230px;
  background:var(--panel2);
  border:1px solid var(--line2);
  border-radius:var(--radius);
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  cursor:pointer;z-index:5;
  transition:border-color .12s, box-shadow .12s;
}
.node:hover{border-color:var(--dim)}
.node.selected{
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-soft),0 8px 26px rgba(0,0,0,.5);
}
.node.rband{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,108,240,.18)}
#rubberbox{position:absolute;display:none;border:1px solid var(--accent);background:rgba(124,108,240,.09);border-radius:3px;pointer-events:none;z-index:5}
/* subtle red problem dot — a scene with open findings */
.node-prob{
  position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;
  background:#e06a75;border:2px solid var(--bg);
  box-shadow:0 0 6px rgba(224,106,117,.65);
  z-index:6;pointer-events:none;
}
.node.link-target{border-color:var(--teal);box-shadow:0 0 0 3px rgba(57,196,168,.25)}
.node.focused .node-head{animation:flash 1s ease 1}
@keyframes flash{0%,100%{}50%{filter:brightness(1.8)}}
.node-head{
  display:flex;align-items:center;gap:7px;
  padding:7px 9px;border-bottom:1px solid var(--line);
  border-radius:var(--radius) var(--radius) 0 0;
  cursor:move;
}
.node-head .dot{width:9px;height:9px;border-radius:50%;flex:none}
.node-title{
  font-weight:700;font-size:12.5px;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.node-badge{
  font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:1px 6px;border-radius:5px;flex:none;
}
.t-narrative .dot{background:var(--blue)}
.t-narrative .node-head{background:linear-gradient(180deg,rgba(79,140,201,.16),transparent)}
.t-narrative .node-badge{background:rgba(79,140,201,.18);color:#8fc0ec}
.t-player .dot{background:#1d4ed8}
.t-player .node-head{background:linear-gradient(180deg,rgba(29,78,216,.24),transparent)}
.t-player .node-badge{background:rgba(29,78,216,.22);color:#93b4f7}
.t-npc .dot{background:#b91c1c}
.t-npc .node-head{background:linear-gradient(180deg,rgba(185,28,28,.2),transparent)}
.t-npc .node-badge{background:rgba(185,28,28,.2);color:#ef8f96}
.t-choice .dot{background:#0e7490}
.t-choice .node-head{background:linear-gradient(180deg,rgba(14,116,144,.2),transparent)}
.t-choice .node-badge{background:rgba(14,116,144,.22);color:#7dd3e8}
.t-hub .dot{background:#475569}
.t-hub .node-head{background:linear-gradient(180deg,rgba(71,85,105,.28),transparent)}
.t-hub .node-badge{background:rgba(71,85,105,.28);color:#b6c1d1}
.node.t-hub .node-head{
  border-radius:0;
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 6px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 6px),0 14px);
}
.t-action .dot{background:#c2410c}
.t-action .node-head{background:linear-gradient(180deg,rgba(194,65,12,.2),transparent)}
.t-action .node-badge{background:rgba(194,65,12,.2);color:#f0a37d}
.t-condition .dot{background:#7c3aed}
.t-condition .node-head{background:linear-gradient(180deg,rgba(124,58,237,.2),transparent)}
.t-condition .node-badge{background:rgba(124,58,237,.22);color:#c4aefb}
.t-jump .dot{background:#0891b2}
.t-jump .node-head{background:linear-gradient(180deg,rgba(8,145,178,.2),transparent)}
.t-jump .node-badge{background:rgba(8,145,178,.22);color:#7dd3fc}
.t-text .dot{background:#166534}
.t-text .node-head{background:linear-gradient(180deg,rgba(22,101,52,.24),transparent)}
.t-text .node-badge{background:rgba(22,101,52,.22);color:#86c99b}
.t-exposition .dot{background:#15803d}
.t-exposition .node-head{background:linear-gradient(180deg,rgba(21,128,61,.24),transparent)}
.t-exposition .node-badge{background:rgba(21,128,61,.22);color:#8ecf9d}
.node-spk{font-size:9.5px;font-weight:700;letter-spacing:.4px;padding:1px 5px;border-radius:5px;flex:none;background:rgba(255,255,255,.07);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-footloc{font-size:9.5px;font-weight:600;letter-spacing:.4px;padding:1px 5px;border-radius:5px;flex:none;background:rgba(255,255,255,.07);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-beat{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border-radius:4px;padding:1px 6px;flex:none;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-req{font-size:9.5px;font-weight:600;letter-spacing:.4px;padding:1px 5px;border-radius:5px;flex:none;background:rgba(216,180,160,.16);color:#d8b4a0;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-cond{font-size:9.5px;font-weight:600;letter-spacing:.4px;padding:1px 5px;border-radius:5px;flex:none;background:rgba(232,179,75,.14);color:#eec26b;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-ending .dot{background:var(--rose)}
.t-ending .node-head{background:linear-gradient(180deg,rgba(224,106,117,.16),transparent)}
.t-ending .node-badge{background:rgba(224,106,117,.18);color:#f0a2a9}
.t-note .dot{background:#ca8a04}
.t-note .node-head{background:linear-gradient(180deg,rgba(202,138,4,.18),transparent)}
.t-note .node-badge{background:rgba(202,138,4,.2);color:#e7c45f}
.t-note{opacity:.82;transform:rotate(-1.2deg);border-radius:4px;border:1px dashed rgba(202,138,4,.55);
  background:linear-gradient(180deg,rgba(202,138,4,.2),rgba(202,138,4,.06) 42%,var(--panel2));
  transition:border-color .12s, box-shadow .12s, transform .12s}
.t-note:hover{transform:rotate(0deg)}
/* per-type structural accents: speaker/type stripes, serif prose for Player */
.t-npc{border-left:4px solid #b91c1c}
.t-choice{border-left:4px solid #0e7490}
.t-player{border-top:4px solid #1d4ed8}
.t-player .node-body{font-family:Georgia,'Times New Roman',serif}
.node.start::after{
  content:"START";position:absolute;top:-9px;left:9px;
  background:var(--accent);color:#fff;font-size:8.5px;font-weight:800;letter-spacing:1px;
  padding:1px 6px;border-radius:4px;z-index:2;
}
.node-img{height:84px;background-size:cover;background-position:center;border-bottom:1px solid var(--line)}
.node-body{
  padding:8px 10px;font-size:11.5px;line-height:1.5;color:var(--dim);
  max-height:96px;overflow:hidden;position:relative;
}
.node-body .tlink-chip{margin:1px 0;display:inline-block}
.node-foot{
  display:flex;justify-content:space-between;gap:6px;
  padding:5px 10px;border-top:1px solid var(--line);
  color:var(--faint);font-size:10px;
}
.node-foot .warn{color:var(--rose);font-weight:700}
.port{
  position:absolute;width:13px;height:13px;border-radius:50%;
  background:var(--panel3);border:2px solid var(--line2);
  top:50%;transform:translateY(-50%);z-index:6;cursor:crosshair;
}
.port:hover{border-color:var(--teal);background:var(--teal)}
.port.in{left:-8px}
.port.out{right:-8px}
.port.out{border-color:var(--accent)}
.port.out:hover{background:var(--accent)}

/* zoom-adaptive cards — below the pill threshold (ZOOM_PILL_ON) every card
   collapses into a compact capsule: color dot + title + type icon. Prose,
   chips, portraits and ports return as you zoom back in. JS keeps the geometry
   honest: setPillMode() toggles .pill here, restates inline widths and
   re-measures heights so edges, arc frames and the minimap stay anchored. */
.node-ico{display:none;font-style:normal;font-size:10.5px;flex:none;color:var(--faint)}
#world.pill .node{border-radius:999px}
#world.pill .node-head{padding:5px 10px;gap:6px;border-bottom:none;border-radius:999px}
#world.pill .node-title{font-size:11.5px}
#world.pill .node-ico{display:inline}
#world.pill .node-img,
#world.pill .node-body,
#world.pill .node-foot,
#world.pill .node-tag,
#world.pill .node-arc,
#world.pill .node-spk,
#world.pill .node-subtype,
#world.pill .node-badge,
#world.pill .port{display:none}
/* labels ride on the map surface — at pill zoom they would smother the
   capsules, so they fold away with the card chrome (click an edge to inspect) */
#world.pill .edge-label{display:none}

/* text-link chips inside previews */
.tlink-chip{
  display:inline-block;background:var(--accent-soft);color:#b7adfb;
  border:1px solid rgba(124,108,240,.4);border-radius:5px;
  padding:0 5px;font-size:10.5px;
}
.tlink-chip.missing{background:rgba(224,106,117,.12);border-color:rgba(224,106,117,.5);color:#f0a2a9;border-style:dashed}
.tlink-chip i{font-style:normal;opacity:.7;margin-left:3px}
.tlink-chip.gated{border-style:dashed}
.tlink-chip .tl-gate{font-size:10px;opacity:.85;margin-left:2px}
.choicerow input[data-chc]{flex:1.2}
.choicerow input[data-chtone]{flex:.7}

/* edges */
.edge-path{fill:none;stroke:var(--line2);stroke-width:2}
.edge-path.main{stroke:#e8b34b;stroke-width:2.6;filter:drop-shadow(0 0 2px rgba(232,179,75,.45))}
.edge-path.main.ch{stroke:#e8b34b;stroke-dasharray:5 5}
.edge-path.main.selected{stroke:var(--accent);filter:drop-shadow(0 0 3px rgba(124,108,240,.6))}
.edge-path.selected{stroke:var(--accent);stroke-width:2.6;filter:drop-shadow(0 0 3px rgba(124,108,240,.6))}
.temp-path{fill:none;stroke:var(--teal);stroke-width:2;stroke-dasharray:6 5}

/* minimap */
#minimap{
  position:absolute;right:14px;bottom:14px;width:150px;height:96px;
  background:rgba(18,21,28,.92);border:1px solid var(--line);
  border-radius:8px;z-index:20;overflow:hidden;cursor:crosshair;
}
#minimap .mmdot{position:absolute;width:6px;height:5px;border-radius:1.5px;opacity:.85}
#minimap .mmdot.start{width:9px;height:6px;opacity:1;box-shadow:0 0 5px var(--accent)}
#minimap svg.mmedges{position:absolute;left:0;top:0;pointer-events:none}
#mmview{position:absolute;border:1px solid var(--accent);background:var(--accent-soft);border-radius:2px;pointer-events:none}
@media (max-width:1000px){#minimap{display:none}}
/* ▤ beat ruler — a beat-colored filmstrip pinned to the top of the map canvas */
#beatRuler{position:absolute;top:8px;left:14px;z-index:24;display:flex;width:max-content;max-width:calc(100% - 28px);height:24px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--bg-2);box-shadow:0 5px 16px rgba(0,0,0,.4)}
#beatRuler[hidden]{display:none}
.br-seg{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 9px;cursor:pointer;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--text);white-space:nowrap;overflow:hidden}
.br-seg + .br-seg{border-left:1px solid rgba(0,0,0,.35)}
.br-seg .n{color:var(--dim);font-weight:600;font-size:9px}
.br-seg:hover{filter:brightness(1.3)}
@media (max-width:1000px){#beatRuler{display:none}}
.tbtn[disabled]{opacity:.35;cursor:default;pointer-events:none}

/* find bar — Ctrl+F scene search over the graph */
#findBar{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:6px;
  background:var(--panel);border:1px solid var(--line2);border-radius:10px;
  padding:6px 8px;box-shadow:0 8px 26px rgba(0,0,0,.45);
}
#findBar .fb-ico{opacity:.65;font-size:13px;flex:none}
#findInput{
  width:260px;background:var(--panel3);border:1px solid var(--line2);border-radius:6px;
  color:var(--text);font:inherit;font-size:12.5px;padding:5px 8px;outline:none;
}
#findInput:focus{border-color:var(--accent)}
#findBar .fb-count{font-size:11px;color:var(--faint);min-width:34px;text-align:center;flex:none}
#findBar button{
  flex:none;background:var(--panel3);border:1px solid var(--line2);border-radius:6px;
  color:var(--text);font-size:12px;padding:4px 7px;cursor:pointer;
}
#findBar button:hover{border-color:var(--accent)}
.node.find-dim{opacity:.14;filter:saturate(.3)}
.edge-path.find-dim{opacity:.07}
.edge-label.find-dim{opacity:.07}

/* variable type filter chips in the library sidebar */
.lib-typebar{display:flex;gap:5px;flex-wrap:wrap;padding:2px 10px 8px}
.lib-typetag{
  cursor:pointer;font-size:10.5px;padding:2px 9px;border-radius:9px;
  background:var(--panel3);border:1px solid var(--line2);color:var(--faint);
}
.lib-typetag.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* status bar */
#statusbar{
  position:absolute;left:12px;bottom:12px;z-index:20;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:calc(100% - 130px);
}
.stat-chip{
  background:var(--panel2);border:1px solid var(--line);border-radius:20px;
  padding:4px 11px;font-size:11.5px;color:var(--dim);cursor:default;
}
.stat-chip.warn{border-color:rgba(224,106,117,.6);color:#f0a2a9;cursor:pointer}
.stat-chip.warn:hover{background:rgba(224,106,117,.12)}
.stat-chip label{display:flex;align-items:center;gap:5px;cursor:pointer}

/* ---------- live Problems panel ---------- */
#problems{
  position:absolute;left:12px;bottom:56px;z-index:21;width:min(540px,calc(100% - 130px));
  max-height:min(42vh,340px);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 34px rgba(0,0,0,.4);overflow:hidden;
}
#problems[hidden]{display:none}
#prob-head{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--dim);flex:none}
#prob-head b{color:var(--text);font-size:12.5px}
#prob-head label{display:flex;align-items:center;gap:4px;cursor:pointer}
#prob-head .tbtn{margin-left:auto}
#prob-list{overflow-y:auto;padding:2px 10px 10px}
#prob-list .issue{cursor:pointer;margin:5px 0;transition:border-color .12s}
#prob-list .issue.dead{cursor:default;opacity:.85}
#prob-list .issue:not(.dead):hover{border-color:var(--teal)}
#prob-list .allgood{padding:14px 4px 10px}

/* ---------- Inspector ---------- */
#inspector{
  width:320px;flex:none;background:var(--panel);
  border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;z-index:25;
}
.insp-scroll{flex:1;overflow-y:auto;padding:14px}
.insp-h{
  font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--faint);margin:18px 0 7px;
}
.insp-h:first-child{margin-top:0}
.fld{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}
.fld:focus{outline:none;border-color:var(--accent)}
.fld.mono{font-family:var(--mono);font-size:12.5px}
textarea.fld{resize:vertical;min-height:150px;line-height:1.55;-webkit-user-select:text;user-select:text}
select.fld{appearance:none;background-image:none}
.row{display:flex;gap:7px;margin-top:8px}
.row .tbtn{flex:1;justify-content:center}
.tbtn.danger{color:#f0a2a9}
.tbtn.danger:hover{background:rgba(224,106,117,.12);border-color:rgba(224,106,117,.5)}
.tbtn.on{background:var(--accent-soft);border-color:var(--accent);color:#cfc8ff}
.prev-box{
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;font-size:13px;line-height:1.6;max-height:260px;overflow-y:auto;
}
.prev-box h1{font-size:19px;margin:.2em 0 .3em}
.prev-box h2{font-size:16px;margin:.2em 0 .3em}
.prev-box h3{font-size:14px;margin:.2em 0 .3em}
.prev-box p{margin:.45em 0}
.prev-box ul,.prev-box ol{margin:.45em 0 .45em 1.3em}
.prev-box blockquote{border-left:3px solid var(--accent);padding-left:10px;color:var(--dim);margin:.5em 0}
.prev-box code{font-family:var(--mono);background:var(--panel3);border-radius:4px;padding:1px 4px;font-size:12px}
.prev-box pre{background:var(--panel3);border-radius:8px;padding:10px;overflow-x:auto;margin:.5em 0}
.prev-box hr{border:none;border-top:1px solid var(--line2);margin:.8em 0}
.prev-box a.tlink{color:#b7adfb;text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer}
.linklist{display:flex;flex-direction:column;gap:5px}
.linkrow{
  display:flex;align-items:center;gap:7px;
  background:var(--panel2);border:1px solid var(--line);border-radius:7px;
  padding:5px 8px;font-size:12px;
}
.linkrow .arrow{color:var(--accent);font-weight:700}
.linkrow .lbl{flex:1;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;padding:0 2px}
.linkrow button:hover{color:var(--rose)}
.hint{font-size:11.5px;color:var(--faint);line-height:1.55}
.hint code{font-family:var(--mono);background:var(--panel3);border-radius:4px;padding:0 4px;color:var(--dim);font-size:11px}

/* ---------- Outline view ---------- */
#outlineview{
  flex:1;overflow-y:auto;padding:20px 22px;background:var(--bg);
}
#outlineview[hidden]{display:none}

/* ---------- Player ---------- */
#play{
  position:fixed;inset:0;z-index:100;
  background:radial-gradient(1200px 700px at 50% -10%,#1a1e2a,var(--bg) 70%);
  display:flex;flex-direction:column;
}
#play[hidden]{display:none}
.play-bar{
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  border-bottom:1px solid var(--line);background:var(--panel);flex:none;
}
.play-bar .mid{flex:1;text-align:center;color:var(--dim);font-size:12px;letter-spacing:.4px}
#playStage{flex:1;overflow-y:auto;padding:40px 16px}
#playPage{
  max-width:640px;margin:0 auto;
  font-family:var(--serif);font-size:17.5px;line-height:1.75;color:#dfe3ec;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:34px 38px;box-shadow:0 20px 60px rgba(0,0,0,.45);
}
#playPage h1{font-size:25px;margin:.2em 0 .4em;color:#fff}
#playPage h2{font-size:20px;margin:.3em 0}
#playPage h3{font-size:17px;margin:.3em 0}
#playPage p{margin:.6em 0}
#playPage ul,#playPage ol{margin:.6em 0 .6em 1.4em}
#playPage blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--dim);margin:.8em 0;font-style:italic}
#playPage code{font-family:var(--mono);font-size:14px;background:var(--panel3);border-radius:4px;padding:1px 5px}
#playPage pre{background:var(--panel3);border-radius:8px;padding:12px;overflow-x:auto}
#playPage hr{border:none;border-top:1px solid var(--line2);margin:1.2em 0}
#playPage a.tlink{
  display:inline-block;background:var(--accent-soft);border:1px solid rgba(124,108,240,.45);
  color:#cfc8ff;border-radius:7px;padding:2px 10px;margin:2px 2px;text-decoration:none;
  font-family:var(--font);font-size:14px;cursor:pointer;
}
#playPage a.tlink:hover{background:rgba(124,108,240,.3)}
#playPage a.tlink.missing{opacity:.5;border-style:dashed;cursor:not-allowed}
.play-choices{display:flex;flex-direction:column;gap:9px;margin-top:22px}
.play-choice{
  background:var(--panel2);border:1px solid var(--line2);border-radius:10px;
  color:var(--text);font-size:15px;font-family:var(--font);
  padding:11px 16px;text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:10px;
}
.play-choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.play-choice.visited{border-style:dashed}
.play-choice.locked{opacity:.62}
.play-choice .pc-vis{margin-left:auto;color:var(--dim);font-size:11.5px;font-family:var(--font);white-space:nowrap}
.play-choice .pc-req{margin-left:auto;color:#d8b4a0;font-size:11.5px;font-family:var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%}
.play-choice .pc-tone{flex:none;width:9px;height:9px;border-radius:50%;margin-right:1px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.play-req{display:inline-block;margin:0 0 10px;font-size:12px;color:#d8b4a0;border:1px dashed rgba(216,180,160,.45);border-radius:8px;padding:3px 9px}
.play-choice .bullet{color:var(--accent);font-weight:800}
.play-end{
  margin-top:26px;text-align:center;color:var(--faint);
  font-family:var(--font);font-size:13px;letter-spacing:3px;text-transform:uppercase;
}
.play-note{margin-top:18px;font-family:var(--font);font-size:12.5px;color:var(--faint);border-top:1px dashed var(--line2);padding-top:10px}
.play-speaker{
  display:inline-block;font-family:var(--font);font-weight:800;font-size:12px;letter-spacing:1.5px;
  text-transform:uppercase;border:1px solid var(--line2);border-radius:999px;padding:3px 12px;margin:0 0 10px 0;
}
.play-route{margin-top:16px;font-family:var(--font);font-size:11.5px;color:var(--faint);line-height:1.7}
.play-route div{opacity:.85}
.play-state{
  margin-top:18px;display:flex;flex-wrap:wrap;gap:6px;
  font-family:var(--font);font-size:11.5px;
  border-top:1px dashed var(--line2);padding-top:10px;
}
.play-state span{
  background:rgba(124,108,240,.14);border:1px solid rgba(124,108,240,.4);
  color:#b7adfb;border-radius:5px;padding:1px 7px;font-family:var(--mono);
}

/* ---------- Modal / toast ---------- */
#modal{
  position:fixed;inset:0;z-index:120;background:rgba(8,10,14,.6);
  display:flex;align-items:center;justify-content:center;padding:24px;
  backdrop-filter:blur(3px);
}
#modal[hidden]{display:none}
.modal-card{
  background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  width:640px;max-width:100%;max-height:82vh;display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
}
.modal-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.modal-head .modal-close{margin-left:auto;background:none;border:none;color:var(--faint);font-size:16px;cursor:pointer;padding:2px 6px}
.modal-head .modal-close:hover{color:var(--text)}
#modalBody{padding:16px 18px;overflow-y:auto;font-size:13px;line-height:1.6}
#modalBody h3{font-size:13px;margin:14px 0 6px;color:var(--accent)}
#modalBody table{border-collapse:collapse;width:100%;margin:6px 0}
#modalBody th,#modalBody td{border:1px solid var(--line);padding:6px 10px;text-align:left;font-size:12.5px}
#modalBody th{color:var(--dim);font-weight:600;background:var(--panel2)}
#modalBody code{font-family:var(--mono);background:var(--panel3);border-radius:4px;padding:0 4px;font-size:12px}
.issue{
  display:flex;align-items:center;gap:10px;
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;margin:6px 0;font-size:12.5px;
}
.issue .sev{font-weight:800;font-size:10px;letter-spacing:1px;border-radius:4px;padding:2px 6px;flex:none}
.issue.err .sev{background:rgba(224,106,117,.18);color:#f0a2a9}
.issue.warn .sev{background:rgba(232,179,75,.18);color:#f2ce7d}
.issue .msg{flex:1}
.issue button{flex:none}
.allgood{color:var(--teal);font-weight:700;padding:8px 0;font-size:14px}
#toast{
  position:fixed;bottom:52px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel3);border:1px solid var(--line2);color:var(--text);
  border-radius:10px;padding:9px 16px;font-size:13px;z-index:200;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:80vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Context menu ---------- */
#ctxmenu{
  position:fixed;z-index:150;background:var(--panel2);
  border:1px solid var(--line2);border-radius:10px;
  box-shadow:0 12px 34px rgba(0,0,0,.55);min-width:200px;padding:5px;
}
#ctxmenu[hidden]{display:none}
#ctxmenu button{
  display:flex;align-items:center;gap:8px;width:100%;
  background:none;border:none;color:var(--text);font-size:12.5px;
  padding:7px 10px;border-radius:7px;cursor:pointer;text-align:left;
}
#ctxmenu button:hover{background:var(--accent-soft)}
#ctxmenu button.danger{color:#f0a2a9}
#ctxmenu button.danger:hover{background:rgba(224,106,117,.12)}
#ctxmenu .ctx-sep{height:1px;background:var(--line);margin:4px 6px}
#toast b{color:#b7adfb}
@media (max-width:1200px){#sidebar{display:none}}
@media (max-width:1100px){.zoomgroup{display:none}}
@media (max-width:900px){#inspector{position:absolute;right:0;top:0;bottom:0;box-shadow:-10px 0 30px rgba(0,0,0,.5)}}
/* ---- common fields: tags, characters, dates ---- */
.node-tag {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 9.5px; letter-spacing: .3px;
  background: rgba(124,108,240,.12); color: #b7adfb;
  border: 1px solid rgba(124,108,240,.35);
  border-radius: 4px; padding: 0 5px; margin-left: 6px;
  white-space: nowrap;
}
.node-arc {
  font-size: 9.5px; font-weight: 700; letter-spacing: .4px;
  border: 1px solid currentColor; border-radius: 4px;
  padding: 0 5px; margin-left: 6px; opacity: .9;
  white-space: nowrap; flex: none; max-width: 110px;
  overflow: hidden; text-overflow: ellipsis;
}
.arc-dot{width:9px;height:9px;border-radius:50%;flex:none}
.arc-ownrow{padding:2px 8px 4px}
.arc-ownrow select{width:100%;font-size:11px;padding:3px 6px}
#arcspane{flex:1;overflow-y:auto;padding:0 8px 12px}
#arcspane .lib-h{margin-top:10px}
#arcspane .lib-item{cursor:pointer}
.node-date {
  font-family: sans-serif; font-size: 10px; color: #8b93a7;
  border: 1px dashed #3a4154; border-radius: 4px; padding: 0 5px; margin-left: 6px;
  white-space: nowrap;
}
.node-subtype {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 9.5px; letter-spacing: .3px;
  background: rgba(148,163,184,.12); color: #cbd5e1;
  border: 1px solid rgba(148,163,184,.35);
  border-radius: 4px; padding: 0 5px; margin-left: 6px;
  white-space: nowrap;
}
.node-tags {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 9.5px; color: #9aa3b8;
  border: 1px dashed #3a4154; border-radius: 4px;
  padding: 0 5px; margin-left: 6px; white-space: nowrap;
}
/* screenplay block inside node bodies */
.screenplay {
  font-family: "Courier New", Courier, monospace;
  font-size: 10.5px; line-height: 1.55; color: #cdd3e2;
  background: #10131a; border: 1px solid #2b3140; border-left: 2px solid #ca8a04;
  border-radius: 6px; padding: 8px 10px; margin: 0 0 8px 0;
  overflow-x: auto; white-space: pre-wrap;
}
.screenplay b { color: #e8d48a; letter-spacing: 1px; }
.screenplay .sp-blank { min-height: .9em; }
/* quote-style dialogue: '''SPEAKER: line''' — speaker accent above each quote */
.dlog { margin: .5em 0; }
.dlog-line { border-left: 2px solid rgba(124,108,240,.35); padding: 2px 0 2px 10px; margin: 0 0 4px 0; }
.dlog-line .dspk { display: block; font-family: var(--font); font-weight: 800; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #8b93a7; margin-bottom: 1px; }
/* hub act labels shown when the body is empty */
.hub-chips { display: flex; flex-wrap: wrap; gap: 4px; }.hub-chip {
  font-family: sans-serif; font-size: 8.5px; font-weight: 800;
  letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap;
  color: #dfe3ec; background: rgba(71,85,105,.32);
  border: 1px solid rgba(71,85,105,.7); border-radius: 4px; padding: 2px 6px;
}
/* inspector: choice rows */
.choicerow { display: flex; gap: 6px; margin-top: 6px; }
.choicerow .fld { min-width: 0; }
.choicerow input[data-cht] { flex: 1.1; }
.choicerow input[data-chl] { flex: 1; }
.choicerow button { flex: none; }
/* dashed edges for explicit choice targets that aren't graph links */
.edge-path.ch { stroke: #5b6478; stroke-dasharray: 5 5; }
.edge-label.ch { color: #5d6478; }
[data-theme="light"] .edge-label { box-shadow: 0 1px 6px rgba(15,23,42,.18); }
[data-theme="light"] .edge-label .econd { color: #5b4fc0; }
[data-theme="light"] .edge-edit { box-shadow: 0 6px 18px rgba(15,23,42,.25); }
/* timeline view */
#timelineview {
  flex: 1; overflow: auto; padding: 22px 28px 60px 22px;
  background: #0b0d12;
}
.tl-year {
  position: sticky; top: 0; z-index: 2;
  font-family: sans-serif; font-size: 12px; font-weight: 800; letter-spacing: 2px;
  color: #b7adfb; text-transform: uppercase;
  margin: 26px 0 8px 0; padding: 6px 0 6px 14px;
  border-left: 2px solid #7c6cf0; background: #0b0d12;
}
.tl-year.tl-nodate { color: #8b93a7; border-left-color: #3a4154; }
.tl-row {
  background: #15181f; border: 1px solid #2b3140; border-left: 3px solid #4f8cc9;
  border-radius: 10px; padding: 10px 14px; margin: 8px 0 8px 8px; cursor: pointer;
  max-width: 640px;
}
.tl-row:hover { border-color: #4a5470; }
.tl-row.selected { border-color: #7c6cf0; }
.tl-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tl-date {
  font-family: sans-serif; font-size: 10.5px; color: #8b93a7;
  border: 1px dashed #3a4154; border-radius: 5px; padding: 1px 6px; white-space: nowrap;
}
.tl-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tl-top b { font-size: 13.5px; color: #dfe3ec; }
.tl-type { font-family: sans-serif; font-size: 10px; color: #8b93a7; margin-left: auto; white-space: nowrap; }
.tl-char { font-family: sans-serif; font-size: 11.5px; font-weight: 700; margin-top: 5px; }
.tl-char i { font-style: normal; font-weight: 400; color: #8b93a7; margin-left: 7px; }
.tl-hub { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.tl-hub span {
  font-size: 8.5px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
  color: #dfe3ec; background: rgba(71,85,105,.32); border: 1px solid rgba(71,85,105,.7);
  border-radius: 4px; padding: 2px 6px;
}
.tl-row p { margin: 6px 0 0 0; font-size: 12px; color: #8b93a7; line-height: 1.55; }
[data-theme="light"] #timelineview { background: #eef0f6; }
[data-theme="light"] .tl-year { background: #eef0f6; color: #6d5bd0; }
[data-theme="light"] .tl-row { background: #fff; border-color: #d7dbe6; }
[data-theme="light"] .tl-row:hover { border-color: #a8afc4; }
[data-theme="light"] .tl-date { color: #66708a; border-color: #c4cadb; }
[data-theme="light"] .screenplay { background: #f4f2ec; border-color: #d9d3ba; border-left-color: #ca8a04; color: #3d4354; }
/* play page: scene slug, character meta, screenplay, hub chips */
.play-slug{
  font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:#8b93a7;border-bottom:1px solid var(--line2);padding-bottom:5px;margin:0 0 12px 0;
}
.play-charmeta { font-family: sans-serif; font-size: 11px; color: #8b93a7; margin: -2px 0 8px 0; }
.play-screen {
  font-family: "Courier New", Courier, monospace; font-size: 12.5px; line-height: 1.7;
  color: #cdd3e2; background: #10131a; border: 1px solid #2b3140; border-left: 2px solid #ca8a04;
  border-radius: 8px; padding: 14px 18px; margin: 0 0 14px 0; white-space: pre-wrap;
}
.play-screen b { color: #e8d48a; letter-spacing: 1px; }
.play-screen .sp-blank { min-height: 1em; }
.play-hubchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.play-hubchips span {
  font-family: sans-serif; font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
  color: #dfe3ec; background: rgba(71,85,105,.32); border: 1px solid rgba(71,85,105,.7);
  border-radius: 5px; padding: 4px 10px;
}

/* ---------- Library sidebar ---------- */
.side-tabs{display:flex;gap:0;padding:8px 8px 0;flex:none}
.stab{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:transparent;border:1px solid transparent;border-bottom:none;
  color:var(--faint);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  padding:7px 6px;cursor:pointer;border-radius:8px 8px 0 0;
}
.stab:hover{color:var(--dim)}
.stab.on{background:var(--panel2);border-color:var(--line);color:var(--text)}
.stab b{
  font-weight:700;letter-spacing:0;background:var(--panel3);color:var(--dim);
  border-radius:9px;padding:0 6px;font-size:10px;
}
#libraryview{flex:1;overflow-y:auto;padding:0 8px 12px}
.lib-sec{margin-bottom:10px}
.lib-h{
  display:flex;align-items:center;gap:6px;padding:7px 4px 5px;
  font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);
}
.lib-h b{font-weight:600;color:var(--dim);letter-spacing:0;text-transform:none;flex:1}
.lib-add{
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  border-radius:6px;width:20px;height:18px;font-size:12px;line-height:1;cursor:pointer;flex:none;
}
.lib-add:hover{color:var(--text);border-color:var(--line2)}
.lib-item{
  display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;
  font-size:12px;color:var(--dim);cursor:pointer;border:1px solid transparent;margin-bottom:1px;
}
.lib-item:hover{background:var(--panel2);color:var(--text)}
.lib-item.active{background:var(--accent-soft);border-color:rgba(124,108,240,.35);color:#cfc8ff}
.lib-portrait{
  width:20px;height:20px;border-radius:6px;flex:none;font-size:9px;font-weight:800;
  color:#fff;display:inline-flex;align-items:center;justify-content:center;letter-spacing:.5px;
}
.lib-dot{width:10px;height:10px;border-radius:50%;flex:none}
.lib-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-sub{font-size:10px;color:var(--faint);flex:none;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-badge{
  font-size:8.5px;font-weight:800;letter-spacing:.5px;padding:1px 5px;border-radius:4px;flex:none;
}
.lib-badge.main{background:rgba(124,108,240,.16);color:#a99df5}
.lib-badge.secondary{background:rgba(79,140,201,.16);color:#7fb3dd}
.lib-badge.casual{background:rgba(122,130,150,.18);color:var(--dim)}
.lib-badge.absent{background:rgba(224,106,117,.14);color:var(--rose)}
.lib-var{font-family:var(--mono);font-size:11px}
.lib-label{display:block;font-size:10.5px;color:var(--faint);font-style:italic;margin-bottom:1px}
.lib-groupname{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px;border-top:1px dashed var(--line);margin-top:8px}
.lib-empty{font-size:10.5px;color:var(--faint);padding:2px 8px 4px;font-style:italic}
/* @mention chips in prose */
.mention{
  display:inline-block;border-radius:5px;padding:0 5px;font-weight:600;font-size:.95em;
  background:var(--accent-soft);border:1px solid rgba(124,108,240,.35);color:#cfc8ff;
}
.mention.m-location{background:rgba(57,196,168,.12);border-color:rgba(57,196,168,.4);color:#5fd6bd}
.mention.m-item{background:rgba(232,179,75,.12);border-color:rgba(232,179,75,.4);color:#eec26b}
/* {{when:}} blocks in author views */
.whenbox{outline:1px dashed rgba(124,108,240,.5);outline-offset:2px;border-radius:3px}
.saidbox{outline:1px dashed rgba(232,179,75,.55);outline-offset:2px;border-radius:3px}
/* speaker portrait initials on node cards */
.spk-portrait{
  display:inline-flex;align-items:center;justify-content:center;font-style:normal;
  font-size:8px;font-weight:800;color:#fff;background:var(--rose);
  border-radius:4px;padding:1px 3px;margin-right:4px;letter-spacing:.5px;flex:none;
}
/* ---------- Character sheets view ---------- */
#charactersview{flex:1;overflow-y:auto;padding:26px 30px 60px}
.cs-bar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.cs-bar h2{font-size:16px;letter-spacing:.5px}
.cs-bar .hint{flex:1}
.cs-grid{display:grid;grid-template-columns:repeat(2,minmax(290px,1fr));gap:18px;align-items:start}
/* 🤝 relationships roster — sortable cast table in the Char view */
.roster{width:100%;border-collapse:collapse;font-size:13px;margin-top:2px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.roster th{text-align:left;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
.roster th.on{color:var(--accent)}
.roster th .r-tht{font-style:normal;opacity:.65;text-transform:none;letter-spacing:.3px}
.roster td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.roster tbody tr{cursor:pointer}
.roster tbody tr:hover td{background:rgba(124,108,240,.07)}
.roster tbody tr:last-child td{border-bottom:none}
.r-name{display:inline-flex;align-items:center;gap:9px}
.r-ava{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;flex:none}
.r-nm{font-weight:600}
.r-role{display:block;font-style:normal;font-size:11px;color:var(--dim);letter-spacing:.3px}
.r-chip{display:inline-block;border-radius:5px;padding:0 7px;font-size:11px;margin-left:6px}
.r-dim{color:var(--dim)}
.r-num{text-align:right;font-variant-numeric:tabular-nums}
.charsheet{
  background:var(--panel2);border:1px solid var(--line2);cursor:pointer;
  border-radius:14px;overflow:hidden;font-size:12.5px;line-height:1.55;
}
.charsheet:hover{border-color:var(--accent)}
.cs-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cs-portrait{
  width:38px;height:38px;border-radius:10px;flex:none;color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;letter-spacing:1px;
}
.cs-name{font-size:15px;font-weight:700}
.cs-role{display:block;font-size:11px;color:var(--dim)}
.cs-body{padding:12px 14px}
.cs-desc{color:var(--text);margin-bottom:8px;white-space:pre-wrap}
.cs-row{display:flex;gap:8px;margin:6px 0}
.cs-row b{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;flex:none;width:64px;padding-top:2px}
.cs-row span{flex:1;color:var(--dim)}
.cs-abilities{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.cs-abilities span{
  font-size:10.5px;font-weight:700;background:rgba(124,108,240,.13);color:#b7adfb;
  border:1px solid rgba(124,108,240,.3);border-radius:5px;padding:2px 8px;
}
.cs-attrs{width:100%;border-collapse:collapse;margin:8px 0 2px}
.cs-attrs td{border-top:1px solid var(--line);padding:3px 0;font-size:11.5px}
.cs-attrs td:first-child{color:var(--faint);width:45%}
.cs-attrs td:last-child{text-align:right;font-family:var(--mono);color:var(--dim)}
.trait-chip{display:inline-block;margin:2px 6px 2px 0;padding:3px 10px;font-size:11.5px;background:rgba(124,108,240,.16);border:1px solid rgba(124,108,240,.45);border-radius:999px;cursor:pointer;color:var(--dim)}
.trait-chip:hover{background:rgba(212,99,111,.18);border-color:rgba(212,99,111,.6)}
.cs-traitbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px}
.cs-traitbar b{font-size:11.5px;color:var(--faint);margin-right:2px}
.cs-traittag{padding:3px 10px;font-size:11.5px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;color:var(--dim)}
.cs-traittag i{font-style:normal;color:var(--faint)}
.cs-traittag:hover{border-color:rgba(124,108,240,.6)}
.cs-traittag.on{background:rgba(124,108,240,.25);border-color:rgba(124,108,240,.75);color:#fff}
.cs-traits{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
.cs-trait{padding:2px 9px;font-size:11px;border-radius:999px;background:rgba(124,108,240,.13);border:1px solid rgba(124,108,240,.35);cursor:pointer;color:var(--dim)}
.cs-trait:hover{border-color:rgba(124,108,240,.75)}
.cs-trait.on{background:rgba(124,108,240,.3);border-color:rgba(124,108,240,.8);color:#fff}
.cs-encounter{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2);color:var(--dim)}
.cs-meta{padding:8px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--faint)}
.cs-scenes{padding:8px 14px 10px;border-top:1px solid var(--line)}
.cs-scenes-h{display:block;font-size:9px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.cs-scene{display:inline-block;font-size:10px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin:1px 3px 1px 0;cursor:pointer;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-scene:hover{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
:root[data-theme="light"] .mention{color:#4a3fb5}
:root[data-theme="light"] .mention.m-location{color:#0e7d6b}
:root[data-theme="light"] .mention.m-item{color:#9c6f0e}
/* ---------- view toolbar ---------- */
#viewTabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;margin:0 4px}
.vtbtn{width:30px;height:26px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:7px;color:var(--faint);font-size:14px;cursor:pointer;line-height:1}
.vtbtn:hover{color:var(--text);background:var(--panel3)}
.vtbtn.on{background:var(--accent-soft);color:#cfc8ff;box-shadow:inset 0 0 0 1px rgba(124,108,240,.4)}
:root[data-theme="light"] .vtbtn.on{color:#4a3fb5}
/* ---------- shared view chrome ---------- */
.sheetbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sheetbar h2{font-size:16px;letter-spacing:.5px}
.sheetbar .hint{flex:1}
/* ---------- timeline extras ---------- */
.tl-updown{display:inline-flex;gap:3px;margin-left:10px}
.tl-btn{flex:none;width:20px;height:18px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font-size:10px;line-height:1;cursor:pointer}
.tl-btn:hover{color:var(--text);border-color:var(--line2)}
.tl-tag{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim);background:rgba(79,140,201,.14);border:1px solid rgba(79,140,201,.35);border-radius:4px;padding:1px 6px;white-space:nowrap}
.tl-beat{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border-radius:4px;padding:1px 6px;white-space:nowrap}
.tl-words{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto;white-space:nowrap}
/* ---------- sheet view ---------- */
#sheetview{flex:1;overflow:auto;padding:22px 28px 60px;background:#0b0d12}
.sheet-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.sheet{border-collapse:collapse;width:100%}
table.sheet th{background:var(--panel3);color:var(--faint);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line);white-space:nowrap}
table.sheet td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:top}
table.sheet tr:hover td{background:rgba(124,108,240,.05)}
table.sheet tr.on td{background:var(--accent-soft)}
.sh-idx,.sh-words{padding:6px 8px;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.sh-num{text-align:right}
.sh-cell input,.sh-cell textarea,.sh-cell select{width:100%;border:none;background:transparent;color:var(--text);font:inherit;font-size:12px;padding:6px 8px;outline:none;border-radius:0}
.sh-cell input:focus,.sh-cell textarea:focus,.sh-cell select:focus{background:rgba(124,108,240,.08);box-shadow:inset 0 0 0 1px var(--accent)}
.sh-cell textarea{min-height:36px;max-height:130px;resize:vertical;font-family:var(--mono);font-size:11px;line-height:1.5}
.sh-cell select{appearance:none;-webkit-appearance:none;cursor:pointer}
.sh-title input{font-weight:700}
.sh-tension input{max-width:56px}
[data-theme="light"] #sheetview{background:#eef0f6}
[data-theme="light"] table.sheet th{background:#e9edf5}
/* ---------- radial outline ---------- */
#outlineview{flex:1;overflow:auto;padding:18px;background:#0b0d12}
.rd-stage{position:relative;width:1400px;height:900px;margin:0 auto}
.rd-lines{position:absolute;left:0;top:0;pointer-events:none}
.rd-center{
  position:absolute;left:614px;top:398px;width:172px;text-align:center;pointer-events:none;
}
.rd-center b{display:block;font-size:14px;color:var(--text);padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-center span{font-size:10px;color:var(--faint)}
.rd-center::before{content:"";display:block;width:56px;height:56px;margin:0 auto 8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(124,108,240,.55),rgba(124,108,240,.08));border:1px solid rgba(124,108,240,.5)}
.rd-card{
  position:absolute;width:172px;background:var(--panel2);border:1px solid var(--line2);border-top:3px solid var(--accent);
  border-radius:10px;padding:7px 10px;cursor:grab;font-size:12px;color:var(--text);
  box-shadow:0 2px 10px rgba(0,0,0,.28);user-select:none;
}
.rd-card:active{cursor:grabbing}
.rd-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 2px 10px rgba(0,0,0,.28)}
.rd-card b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;margin-top:2px}
.rd-k{font-size:8.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.rd-sub{font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-theme="light"] #outlineview{background:#eef0f6}
[data-theme="light"] .rd-card{background:#fff}
/* ---------- arc view ---------- */
#arcview{flex:1;overflow:auto;padding:22px 28px 60px;background:#0b0d12}
#scriptview{flex:1;overflow:auto;padding:22px 28px 60px;background:#0b0d12}
[data-theme="light"] #scriptview{background:#eef0f6}
.script{max-width:760px;margin:0 auto;font-family:Georgia,'Times New Roman',serif;color:var(--text)}
.script-scene{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:16px 20px;margin-bottom:14px;cursor:pointer;transition:border-color .15s}
.script-scene:hover{border-color:var(--accent)}
.script-scene.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px rgba(124,108,240,.35)}
.script-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.script-h b{font-size:15px}
.script-icon{opacity:.7}
.script-meta{font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.script-start{font-size:9px;font-weight:800;letter-spacing:1px;color:#fff;background:var(--accent);border-radius:4px;padding:1px 6px}
.script-cue{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.script-body{font-size:13.5px;line-height:1.7;color:var(--text);white-space:pre-wrap}
.script-jump{margin-top:8px;font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.script-exits{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:12.5px}
.script-exit{padding:2px 0;color:var(--dim)}
.script-exit i{color:var(--faint);font-style:italic}
.script-cond{font-family:var(--mono);font-size:10.5px}
#playview{flex:1;overflow:auto;padding:22px 28px 60px;background:#0b0d12}
[data-theme="light"] #playview{background:#eef0f6}
.po{max-width:760px;margin:0 auto}
.po-stats{max-width:760px;margin:0 auto 10px;font-size:12.5px;color:var(--faint)}
.po-stats b{color:var(--text)}
.po-tools{max-width:760px;margin:0 auto 16px;display:flex;gap:8px;flex-wrap:wrap}
.po-page{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;background:var(--panel2);padding:12px 18px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.po-page:hover{border-color:var(--accent)}
.po-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.po-h b{font-size:14.5px}
.po-num{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.po-kind{font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.po-next{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;font-size:12px;line-height:1.9}
.po-exit{color:var(--dim);white-space:nowrap}
.po-exit.po-main{color:#eec26b;font-weight:700}
.po-exit i{color:var(--faint);font-style:italic}
.po-cond{color:var(--accent)}
.po-dangling{color:#e06a75}
.po-unreached{max-width:760px;margin:26px auto 0;border:1px dashed var(--line);border-radius:12px;padding:12px 16px;font-size:12px;color:var(--faint)}
.po-chip{display:inline-block;margin:6px 4px 0;padding:2px 8px;border:1px solid var(--line);border-radius:999px;cursor:pointer}
.po-chip:hover{border-color:var(--accent);color:var(--text)}
.arc-cards{display:flex;gap:8px;align-items:stretch}
.play-cover{height:190px;background-size:cover;background-position:center;border-radius:12px;border:1px solid var(--line);margin:0 0 18px}
.arc-card{flex:1 1 0;min-width:124px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:11px}
.arc-thumb{height:64px;background-size:cover;background-position:center;border-radius:6px;margin:0 0 6px;border:1px solid var(--line)}
.tl-thumb{width:74px;height:56px;background-size:cover;background-position:center;border-radius:6px;border:1px solid var(--line);float:left;margin:2px 12px 4px 0}
.arc-card:hover{border-color:var(--accent)}
.arc-card b{display:block;font-size:12px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arc-beat{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border-radius:4px;padding:1px 6px;color:rgba(10,12,16,.82)}
.arc-meta{color:var(--faint);font-size:10px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arc-strip{display:flex;gap:2px;margin-top:12px}
.arc-seg{flex:1 1 0;min-width:124px;height:28px;border-radius:6px;cursor:pointer;position:relative}
.arc-seg em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:9px;font-weight:800;color:rgba(0,0,0,.55);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
.arc-seg:hover{outline:2px solid var(--accent)}
.arc-chapters{display:flex;gap:2px;margin-top:6px}
.arc-ch{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--dim);border-top:2px solid var(--accent);padding-top:4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-theme="light"] #arcview{background:#eef0f6}
[data-theme="light"] .arc-card{background:#fff}
/* ---------- beat view ---------- */
#beatview{flex:1;overflow:auto;padding:22px 28px 60px;background:#0b0d12}
table.beattbl{border-collapse:collapse;min-width:900px}
table.beattbl th{background:var(--panel3);color:var(--faint);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.beattbl td{padding:7px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text);white-space:nowrap}
table.beattbl tr.brow{cursor:pointer}
table.beattbl tr.brow:hover td{background:rgba(124,108,240,.06)}
table.beattbl tr.brow.on td{background:var(--accent-soft)}
.bt-title{font-weight:700}
.bt-tension{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--dim)}
.bt-tval{font-family:var(--mono);font-size:10px;color:var(--faint)}
.bt-words{font-family:var(--mono);color:var(--faint);text-align:right}
[data-theme="light"] #beatview{background:#eef0f6}
[data-theme="light"] table.beattbl th{background:#e9edf5}
/* ---------- stats view ---------- */
#statsview{flex:1;overflow:auto;padding:26px 30px 60px;background:#0b0d12}
.stat-grid{display:flex;flex-wrap:wrap;gap:12px;margin:4px 0 8px}
.stat-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:132px}
.stat-card b{display:block;font-size:22px;font-family:var(--mono);color:var(--text)}
.stat-card span{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.stats-h2{font-size:15px;margin:24px 0 2px;color:var(--text)}
.stat-chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.stat-chart .hint{display:block;margin-bottom:6px}
.stat-chart svg{width:100%;height:auto;display:block}
[data-theme="light"] #statsview{background:#eef0f6}
[data-theme="light"] .stat-chart,.stat-card{border-color:var(--line)}
@media print{
  body{overflow:visible}
  #topbar,#sidebar,#inspector,#statusbar,#minimap,#play,#viewTabs{display:none!important}
  #main{height:auto}
  #charactersview{overflow:visible;padding:0;background:#fff}
  .cs-bar .tbtn{display:none}
  .charsheet{break-inside:avoid;border-color:#999;background:#fff;color:#000}
  .charsheet *{color:#111!important}
  #outlineview,#timelineview,#sheetview,#arcview,#beatview,#scriptview,#statsview{display:none!important}
}
</style>

<script>
'use strict';
/* =====================================================================
   Loomlight — a free-form branching narrative mind-map studio.
   Inspired by articy:draft (typed fragments), Arrow (narrative graphs),
   Twine (freely linkable scene boxes, [[link]] syntax) and
   drafft (dark editor aesthetics). Single file, no dependencies.

   HOW THE CODE IS LAID OUT (app.js module index, in file order) —
   the file keeps the structure of a split project (main.js: boot &
   wiring · engine.js: state & data · ui.js: views · exporter.js) so
   every concern has one clearly labelled home:
     1. state & scheduleFrame   ·  2. node sub-types
     3. library data            ·  4. markdown engine
     5. sample story            ·  6. persistence, lock, undo
     7. graph mutation & refs   ·  8. rendering (map, minimap, frames)
     9. find · validation · statusbar · problems panel
    10. sidebars: scenes · library · arcs
    11. inspector (node & link editors, per-type options)
    12. selection · edge-label editor · gestures (pan/zoom/drag)
    13. toolbar · modal · context menus
    14. player (play mode engine) · dice · attribute checks · presence
    15. import / export (json, twee, html, png/svg, disk I/O)
    16. the ten views · theme · boot (event wiring at the bottom)
   ===================================================================== */

/* ---------------- state ---------------- */
var LS_KEY = 'loomlight.project.v1';
var story = null;               // {meta:{title,author,start}, nodes:[], links:[]}
var view  = { x: 60, y: 40, z: 1 };
var sel = null, selLink = null; // selected node id / link id
var multiSel = [];              // multi-selection: extra node ids beyond the primary `sel`
var nodeEls = {};               // id -> DOM element (refreshed on render)
var nodeHeights = {};           // id -> last measured card height — one layout pass per render
                                // instead of a forced reflow per edge while dragging.
var snapOn = false;
var sideTab = 'passages';       // 'passages' | 'library' | 'arcs' — active left-sidebar tab
var libSel = null;              // selected library entity { kind, id } — kind: character|location|item|variable|world

/* coalesced per-frame updates — burst typing triggers one re-render per
   animation frame instead of one per keystroke, keeping the inspector and the
   map responsive on large stories */
var frameQ = {};
function scheduleFrame(key, fn){
  if (frameQ[key]) return;
  frameQ[key] = true;
  requestAnimationFrame(function(){ frameQ[key] = false; fn(); });
}

function uid(){ return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
/* IFID — the story's stable fingerprint in the Twee 3 / Twine world: a v4 UUID,
   uppercase per the spec's compiler rule; minted once on first export, then kept */
function makeIFID(){
  var chars = '0123456789abcdef';
  var rnd = (typeof crypto !== 'undefined' && crypto.getRandomValues)
    ? function(){ var b = new Uint8Array(1); crypto.getRandomValues(b); return b[0]; }
    : function(){ return Math.floor(Math.random() * 256); };
  var out = '';
  for (var i = 0; i < 36; i++){
    if (i === 8 || i === 13 || i === 18 || i === 23) out += '-';
    else if (i === 14) out += '4';                        /* v4 marker */
    else if (i === 19) out += chars[8 + (rnd() & 0x3)];    /* variant bits */
    else out += chars[rnd() & 0xf];
  }
  return out.toUpperCase();
}
function byId(id){ for (var i = 0; i < story.nodes.length; i++) if (story.nodes[i].id === id) return story.nodes[i]; return null; }
function byTitle(t){
  t = String(t).trim().toLowerCase();
  for (var i = 0; i < story.nodes.length; i++) if (story.nodes[i].title.trim().toLowerCase() === t) return story.nodes[i];
  return null;
}
function linksOf(id){
  var out = [], i;
  for (i = 0; i < story.links.length; i++) if (story.links[i].from === id) out.push(story.links[i]);
  return out;
}
function words(t){ t = String(t || '').trim(); return t ? t.split(/\s+/).length : 0; }

var TYPES = {
  narrative: 'Narrative',
  player:    'Player',
  npc:       'NPC',
  choice:    'Choice',
  hub:       'Hub',
  action:    'Action',
  condition: 'Condition',
  jump:      'Jump',
  ending:    'Ending',
  note:      'Note',
  text:      'Text',
  exposition: 'Exposition'
};
var TYPE_ICON = {
  narrative: '', player: '●', npc: '💬', choice: '⊞', hub: '◈',
  action: '⚡', condition: '⚙', jump: '↪', ending: '◆', note: '✎', text: '▮', exposition: '▤'
};
var TYPE_COLOR = {
  narrative: '#4f8cc9', player: '#1d4ed8', npc: '#b91c1c', choice: '#0e7490',
  hub: '#475569', action: '#c2410c', condition: '#7c3aed', jump: '#0891b2',
  ending: '#e06a75', note: '#ca8a04', text: '#166534', exposition: '#15803d'
};
/* ---------------- node sub-types ----------------
   Optional per-type refinements. Picking a sub-type stamps the node with
   its default tags (stored in the existing n.labels array — so they
   persist, export to Twee, and stay fully editable). Existing tags are
   never overwritten: defaults are only seeded when the node has none. */
var SUBTYPES = {
  player: {
    action: {
      label: 'Action', icon: '⚡', tags: ['danger'],
      fields: [
        { key: 'danger',      label: 'Danger level', type: 'select', options: ['Low', 'Moderate', 'High', 'Deadly'], default: 'Moderate' },
        { key: 'stakes',      label: 'Stakes',       type: 'text', placeholder: 'What the player risks…', default: '' },
        { key: 'opposition',  label: 'Opposition',   type: 'text', placeholder: 'Who or what stands in the way…', default: '' }
      ]
    }
  },
  exposition: {
    encounter: {
      label: 'Encounter', icon: '⚔', tags: ['exploration'],
      fields: [
        { key: 'threat',      label: 'Threat',            type: 'select', options: ['None', 'Low', 'Moderate', 'High'], default: 'Low' },
        { key: 'exploration', label: 'Exploration focus', type: 'text', placeholder: 'What the reader can find, notice, or learn here…', default: '' },
        { key: 'reward',      label: 'Reward',            type: 'text', placeholder: 'Discovery, loot, insight, ally…', default: '' }
      ]
    }
  }
};
function subtypesOf(type){ return SUBTYPES[type] || {}; }
function subtypeOf(n){ return subtypesOf(n && n.type)[n.subtype] || null; }
function applySubtype(n, sub){
  var d = subtypesOf(n.type)[sub];
  n.subtype = d ? sub : '';
  if (d && d.tags && d.tags.length && !labelsOf(n).length) n.labels = d.tags.slice();
  if (d) ensureSubtypeFields(n);
}
/* Extra fields: a sub-type is a template of per-type fields. Picking one
   attaches its fields to the node and seeds defaults — values the user
   already set are never overwritten. Every field stays editable, persists
   with the node (JSON) and exports to Twee. */
function ensureSubtypeFields(n){
  var d = subtypeOf(n);
  if (!d || !d.fields || !d.fields.length) return;
  if (!n.fields || typeof n.fields !== 'object' || Array.isArray(n.fields)) n.fields = {};
  d.fields.forEach(function(f){
    if (n.fields[f.key] === undefined || n.fields[f.key] === null)
      n.fields[f.key] = (f.default === undefined || f.default === null) ? '' : f.default;
  });
}
function subFieldsHTML(n){
  var d = subtypeOf(n);
  if (!d || !d.fields || !d.fields.length) return '';
  var vals = (n.fields && typeof n.fields === 'object' && !Array.isArray(n.fields)) ? n.fields : {};
  var h = '';
  d.fields.forEach(function(f){
    var v = (vals[f.key] !== undefined && vals[f.key] !== null) ? String(vals[f.key]) : (f.default === undefined ? '' : String(f.default));
    h += '<div class="insp-h" style="margin-top:6px">' + esc(f.label) + '</div>';
    if (f.type === 'select' && Array.isArray(f.options) && f.options.length){
      h += '<select class="fld" data-subfield="' + esc(f.key) + '">';

/* ---------------- persistence (hardened) ----------------
   Versioned save payloads + migration (Ren'Py-style save metadata), a rotating
   ring of safety backups with corruption recovery (Ren'Py keeps crash saves the
   same way), a multi-tab session lock so two tabs can't overwrite each other (the
   classic browser-studio data-loss vector), and no-op write skipping (the spirit
   of Twine's persistable-changes filter). */
var saveBroken = false;
var lockLost = false;                 /* another tab owns the autosave session right now */
var SAVE_V = 2;                       /* save format version — bump + migrate below on breaking changes */
var LS_BAK = 'loomlight.backup.';      /* safety ring: .1 (newest) … .5 (oldest), story-only snapshots */
var LS_LOCK = 'loomlight.lock.v1';    /* multi-tab session lock */
var TAB_ID = uid();
var saveCount = 0;                    /* every 20th save rotates a backup */
var lastPayload = null;               /* skip writes when nothing meaningful changed */
function refreshSaveChip(){
  var c = $('saveChip');
  if (!c) return;
  if (lockLost){
    c.className = 'stat-chip warn';
    c.textContent = '⏸ autosave paused';
    c.title = 'Another tab owns this story\'s autosave — reload this page to take the session back';
    return;
  }
  c.className = 'stat-chip' + (saveBroken ? ' warn' : '');
  c.textContent = saveBroken ? '⚠ autosave off' : '✓ autosave';
  c.title = 'Story, layout and zoom autosave to this browser (format v' + SAVE_V + ' · safety backups rotate automatically)';
}
/* ---------------- persistence ----------------
   save() is debounced: it marks the story dirty and flushes the localStorage
   write ~300 ms later, so a burst of keystrokes costs ONE JSON.stringify of
   the story instead of one per edit. saveNow() flushes immediately and is
   wired to beforeunload / visibilitychange so nothing is ever lost. */
var saveTimer = null, saveDirty = false;
function save(){
  invalidateStoryCaches();             /* story is about to change / has changed — drop memoized issues() + find haystacks */
  if (lockLost) return;
  saveDirty = true;
  if (saveTimer) return;
  saveTimer = setTimeout(function(){ saveTimer = null; if (saveDirty) saveNow(); }, 300);
}
function saveNow(){
  if (lockLost) return;               /* a live tab elsewhere owns the session — never clobber its saves */
  saveDirty = false;
  var payload = null;
  try { payload = '{"v":' + SAVE_V + ',"story":' + serializedStory() + ',"view":' + JSON.stringify(view) + ',"snap":' + snapOn + '}'; }
  catch (e) { payload = null; }
  if (!payload){ saveFail(); return; }
  if (payload === lastPayload) return; /* no meaningful change since the last write */
  try {
    localStorage.setItem(LS_KEY, payload);
    lastPayload = payload;
    saveCount++;
    if (saveCount % 20 === 0) rotateBackup();
    if (saveBroken){ saveBroken = false; refreshSaveChip(); toast('Autosave restored — your progress is being saved again.'); }
  } catch (e) { saveFail(); }
}
function saveFail(){
  if (!saveBroken){
    saveBroken = true;
    refreshSaveChip();
    toast('⚠ Autosave failed — browser storage is full or blocked. Your edits are still in memory this session; free space or use <b>Export ▸ Project .json</b> to save your work to a file.');
  }
}
/* keep a small ring of story-only safety snapshots so one corrupted primary
   write never means losing the story */
function rotateBackup(){
  try {
    for (var i = 4; i >= 1; i--){
      var b = localStorage.getItem(LS_BAK + i);
      if (b) localStorage.setItem(LS_BAK + (i + 1), b);
    }
    localStorage.setItem(LS_BAK + '1', '{"v":' + SAVE_V + ',"t":' + Date.now() + ',"story":' + serializedStory() + '}');
  } catch (e) {} /* best effort — a failed backup must never break the primary save */
}
function validSave(d){
  return !!(d && typeof d === 'object' && d.story && typeof d.story === 'object' && Array.isArray(d.story.nodes));
}
function migrateSave(d){

  return d;
}
function load(){
  var d = null, recovered = 0;
  try { d = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  if (!validSave(d)){
    /* primary missing or unreadable → try the safety ring, newest first */
    for (var i = 1; i <= 5; i++){
      var b = null;
      try { b = JSON.parse(localStorage.getItem(LS_BAK + i) || 'null'); } catch (e) {}
      if (validSave(b)){ d = b; recovered = i; break; }
    }
  }
  if (!validSave(d)) return false;
  d = migrateSave(d);
  story = d.story;
  if (!Array.isArray(story.characters)) story.characters = [];
  story.characters.forEach(function(c){ if (!('location' in c)) c.location = ''; if (!('temperature' in c)) c.temperature = ''; });
  ensureLib();
  story.nodes.forEach(function(n){ if (n.subtype) ensureSubtypeFields(n); });
  story.nodes.forEach(function(n){ if (n.type === 'condition') syncCondChoices(n); });

  if (typeof d.snap === 'boolean') snapOn = d.snap;
  if (recovered){
    toast('⚠ The primary save was unreadable — your story was recovered from safety backup #' + recovered + ' and re-saved.');
    lastPayload = null;   /* force the rewrite even if the payload is identical — the primary slot is corrupt */

/* ---------------- multi-tab session lock ----------------

function lockState(){
  try { return JSON.parse(localStorage.getItem(LS_LOCK) || 'null'); } catch (e) { return null; }
}
function claimLock(force){
  var lk = lockState();
  var now = Date.now();
  if (!force && lk && lk.id !== TAB_ID && now - lk.ts < 6000) return false;  /* a live session elsewhere */
  try { localStorage.setItem(LS_LOCK, JSON.stringify({ id: TAB_ID, ts: now })); } catch (e) {}
  return true;
}
function releaseLock(){
  try { var lk = lockState(); if (lk && lk.id === TAB_ID) localStorage.removeItem(LS_LOCK); } catch (e) {}
